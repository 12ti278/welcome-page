<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome My World · 幻境回廊</title>
<style>
  /* ============================================================
     莫兰迪绿 · 复古核配色（与 总作业1.html 保持一致）
     ============================================================ */
  :root{
    --bg:           #1e241d;
    --bg-soft:      #262c24;
    --surface:      #2c332a;
    --surface-2:    #363d33;
    --border:       #465042;
    --border-soft:  #38402f;

    --text:         #e6e3d4;
    --text-muted:   #99a08c;

    --accent:       #b8c4a3;
    --accent-deep:  #8a9a76;
    --accent-soft:  rgba(184,196,163,.14);

    --vintage:      #c9b98a;
    --stamp:        #9a8556;

    /* 模块卡片配色（米白色） */
    --ink:#3b382f;
    --ink-muted:#7c7666;
    --cream:#f4eee0;
    --cream-2:#eee6d2;
    --line:#d9cfa9;
    --line-soft:#e6ddc4;
    --green:#6f7d5e;
    --green-deep:#57634a;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:"Courier New","Songti SC","STSong","PingFang SC","Microsoft YaHei",monospace;
    background:var(--bg);
    color:var(--text);
    line-height:1.8;
    letter-spacing:.4px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* Lenis 平滑滚动 */
  html.lenis, html.lenis body { height:auto; }
  .lenis.lenis-smooth { scroll-behavior:auto !important; }

  /* 复古核 1：全局胶片颗粒 */
  body::before{
    content:""; position:fixed; inset:0;
    pointer-events:none; z-index:9998; opacity:.07; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* 复古核 2：纸张暗角 */
  body::after{
    content:""; position:fixed; inset:0;
    pointer-events:none; z-index:9997;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.42) 100%);
  }

  /* 主视觉背景：墨绿叶框（已去掉画面中央文字） */
  .bg-art{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:#170a0e url("assets/mint-silence-bg.webp") center center / cover no-repeat;
    transform-origin:50% 46%;
    animation:bgDrift 42s ease-in-out infinite alternate;
    will-change:transform;
  }
  /* 缓慢推拉平移，像镜头在叶影间呼吸 */
  @keyframes bgDrift{
    0%{transform:scale(1.03) translate3d(-.6%, .4%, 0);}
    50%{transform:scale(1.075) translate3d(.8%, -.6%, 0);}
    100%{transform:scale(1.04) translate3d(-.5%, -1%, 0);}
  }
  /* 首页叶影风动：p5 按 列×行 重绘背景，鼠标带动局部风场 */
  .wind-fx{
    position:fixed; inset:0; z-index:-1;
    width:100%; height:100%; pointer-events:none; overflow:hidden;
  }
  .wind-fx canvas{display:block !important; width:100% !important; height:100% !important; pointer-events:none;}
  .wind-on .bg-art{animation:none;}
  /* 首页 p5 微尘层：固定在背景之上、内容之下 */
  .home-fx{
    position:fixed !important; inset:0; z-index:-1;
    pointer-events:none; display:block;
  }

  /* 慢呼吸的光晕背景 */
  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 42%, rgba(184,196,163,.10), transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 78%, rgba(201,185,138,.07), transparent 70%);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.7;transform:scale(1);}
    50%{opacity:1;transform:scale(1.05);}
  }

  .stage{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:20px;
    padding:56px 24px;
  }

  .eyebrow{
    display:inline-block; font-size:11px; letter-spacing:6px;
    color:var(--vintage); font-weight:600;
    text-transform:uppercase;
    padding:5px 16px; border:1px solid rgba(201,185,138,.35);
    background:rgba(23,10,14,.5);
    text-shadow:0 1px 6px rgba(0,0,0,.65);
    animation:rise 1s ease both;
  }
  .eyebrow::before{content:"✦  "; color:var(--vintage);}
  .eyebrow::after{content:"  ✦"; color:var(--vintage);}

  .title{
    font-family:"Courier New",monospace;
    font-size:clamp(50px, 12vw, 132px);
    font-weight:800; letter-spacing:5px; line-height:1.02;
    color:var(--text);
    text-shadow:0 6px 34px rgba(0,0,0,.55);
    animation:rise 1s .15s ease both;
  }
  .title em{
    display:block; font-style:normal;
    color:var(--vintage);
    letter-spacing:2px;
    text-shadow:0 0 26px rgba(201,185,138,.28);
  }

  .sub{
    color:var(--text-muted); font-size:13px; letter-spacing:4px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
    animation:rise 1s .3s ease both;
  }

  /* ---------- 相框（复古双线框 + 胶带 + 角标） ---------- */
  .frame{
    position:relative; width:min(600px, 88vw); aspect-ratio:16/10;
    margin-top:8px;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    animation:rise 1s .42s ease backwards;
    will-change:transform;                 /* 独立合成层：img/贴纸/胶带同层渲染，不撕裂 */
    transition:transform .2s ease-out, box-shadow .2s ease-out;
  }
  /* 卡片 hover：动画只写在 .frame 上（仅 transform: scale），
     贴纸/胶带作为子元素完全继承缩放，保证三者同步不漂移；触屏不触发 */
  @media (hover:hover){
    .frame:hover{ transform:scale(1.02); box-shadow:0 30px 74px rgba(0,0,0,.72); }
  }
  .frame::before{ /* 内嵌细线框 */
    content:""; position:absolute; inset:9px; z-index:3;
    border:1px solid var(--border-soft); pointer-events:none;
  }
  .frame::after{ /* 照片上的做旧渐变 */
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(201,185,138,.09) 0%, transparent 38%, rgba(30,36,29,.5) 100%);
  }
  /* 复古核：四角标记 */
  .corners{position:absolute; inset:-1px; z-index:4; pointer-events:none;}
  .corners i{position:absolute; width:18px; height:18px; border:1px solid var(--vintage); opacity:.6;}
  .corners i:nth-child(1){top:8px;left:8px;border-right:0;border-bottom:0;}
  .corners i:nth-child(2){top:8px;right:8px;border-left:0;border-bottom:0;}
  .corners i:nth-child(3){bottom:8px;left:8px;border-right:0;border-top:0;}
  .corners i:nth-child(4){bottom:8px;right:8px;border-left:0;border-top:0;}

  .slides{position:absolute; inset:0; z-index:1; overflow:hidden; cursor:pointer;}
  .slides img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    opacity:0; transition:opacity .8s ease;
    filter:sepia(.16) saturate(.86) contrast(.99);
  }
  .slides img.active{opacity:1;}

  /* ---------- 贴纸（印在画上）+ 边角胶带 ----------
     层级顺序：油画 img → 贴纸 → 胶带；胶带在最上层，只压住贴纸两个对角。
     贴纸/胶带不写任何 transform，完全继承 .frame 的 scale，保证三者同步不分家。 */
  .frame{
    --sticker-w:184px; --sticker-h:64px;
    --sticker-r:30px;  --sticker-b:30px;
  }
  .sticker{
    position:absolute; z-index:5;
    right:var(--sticker-r); bottom:var(--sticker-b);
    width:var(--sticker-w); height:var(--sticker-h);
    padding:8px 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    mix-blend-mode:multiply;                          /* 与油画底色融合，像印在画上 */
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));    /* 柔和阴影（不用 box-shadow） */
    background:rgba(244,238,224,.5);                  /* 半透明奶油底 */
    border:1px solid rgba(59,56,47,.42);
    color:#3b382f; font-family:"Courier New",monospace;
    text-align:center; line-height:1.35; pointer-events:none;
  }
  .sticker::before{ /* 内嵌细线（复古核） */
    content:""; position:absolute; inset:4px;
    border:1px solid rgba(59,56,47,.25); pointer-events:none;
  }
  .sticker .s-num{ font-size:9px; letter-spacing:3px; opacity:.68; }
  .sticker .s-name{ font-size:12px; letter-spacing:2px; font-weight:700; }

  /* 边角胶带：只压贴纸两对角，位于最上层；旋转烧进 SVG，不用 CSS transform */
  .tape{position:absolute; z-index:7; width:56px; height:56px; pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
  .tape.t1{ /* 贴纸左上角 */
    right:calc(var(--sticker-r) + var(--sticker-w) - 28px);
    bottom:calc(var(--sticker-b) + var(--sticker-h) - 28px);
  }
  .tape.t2{ /* 贴纸右下角 */
    right:calc(var(--sticker-r) - 28px);
    bottom:calc(var(--sticker-b) - 28px);
  }

  /* 左右箭头 */
  .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    z-index:6; width:44px; height:44px;
    background:rgba(30,36,29,.72);
    border:1px solid var(--border); color:var(--text);
    cursor:pointer; font-size:22px; line-height:1;
    display:grid; place-items:center;
    transition:all .3s ease;
  }
  .arrow:hover{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .arrow.left{left:-58px;}
  .arrow.right{right:-58px;}
  @media (max-width:760px){
    .arrow.left{left:8px;}
    .arrow.right{right:8px;}
  }

  /* 圆点 */
  .dots{
    position:absolute; z-index:6; left:50%; bottom:-34px; transform:translateX(-50%);
    display:flex; gap:8px;
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    border:1px solid var(--border); background:transparent;
    cursor:pointer; transition:all .3s ease;
  }
  .dot.active{background:var(--vintage); border-color:var(--vintage);}
  .dot:hover{background:var(--accent-soft);}

  /* ---------- 章节目录（六个部分标题） ---------- */
  .chapters-label{
    margin-top:16px; color:var(--text-muted);
    font-size:10.5px; letter-spacing:5px;
    animation:rise 1s .5s ease both;
  }
  .chapters{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:10px; max-width:820px;
    animation:rise 1s .54s ease both;
  }
  .chapters a{
    font-size:12px; letter-spacing:2px; color:var(--text-muted);
    border:1px solid var(--border); padding:7px 16px;
    text-decoration:none; transition:all .25s ease;
    cursor:pointer;
  }
  .chapters a::before{content:"#"; color:var(--vintage); margin-right:6px;}
  .chapters a:hover{color:var(--accent); border-color:var(--accent);}

  /* ---------- 印章式进入按钮 ---------- */
  .enter{
    margin-top:44px;
    display:inline-flex; align-items:center; gap:12px;
    padding:14px 34px; font-size:13px; font-weight:700;
    color:var(--vintage); border:1px solid var(--vintage);
    letter-spacing:4px; text-decoration:none;
    position:relative; transition:all .3s ease;
    font-family:"Courier New",monospace;
    animation:rise 1s .56s ease both;
  }
  .enter::before{
    content:""; position:absolute; inset:4px;
    border:1px solid rgba(201,185,138,.35); pointer-events:none;
    transition:border-color .3s ease;
  }
  .enter:hover{background:var(--vintage); color:var(--bg);}
  .enter:hover::before{border-color:rgba(30,36,29,.3);}
  .enter .arr{transition:transform .3s ease;}
  .enter:hover .arr{transform:translateX(5px);}

  .hint{color:var(--text-muted); font-size:10.5px; letter-spacing:4px; margin-top:-8px;
    animation:rise 1s .66s ease both;}

  .slide-caption{
    margin-top:22px; color:var(--text); font-size:13px; letter-spacing:3px;
    animation:rise 1s .6s ease both;
  }
  .slide-caption b{color:var(--vintage); font-weight:700; margin:0 2px;}

  @keyframes rise{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ============================================================
     模块详情弹层（米白色卡片）
     ============================================================ */
  .modal{
    position:fixed; inset:0; z-index:1000;
    display:none;
    align-items:center; justify-content:center;
    padding:60px 20px;
  }
  .modal.open{display:flex;}

  .modal-overlay{
    position:absolute; inset:0;
    background:rgba(30,36,29,.75);
    backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .3s ease;
  }
  .modal.open .modal-overlay{opacity:1;}

  .modal-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    filter:saturate(.92) sepia(.06) brightness(.55);
    opacity:0;
    transition:opacity .5s ease;
  }
  .modal.open .modal-bg{opacity:1;}

  .modal-close{
    position:fixed; top:18px; right:24px; z-index:1002;
    width:38px; height:38px;
    background:rgba(30,36,29,.6);
    border:1px solid var(--border);
    color:var(--text);
    font-size:20px; line-height:1;
    cursor:pointer;
    display:grid; place-items:center;
    transition:all .3s ease;
    opacity:0;
    font-family:inherit;
  }
  .modal.open .modal-close{opacity:1; transition-delay:.15s;}
  .modal-close:hover{background:var(--vintage); color:var(--bg); border-color:var(--vintage);}

  .modal-sheet{
    position:relative; z-index:1001;
    width:min(720px, 92vw);
    max-height:calc(100vh - 120px);
    overflow-y:auto;
    background:var(--cream); color:var(--ink);
    padding:56px 48px 48px;
    border:1px solid var(--line);
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    transform:translateY(24px) scale(.97);
    opacity:0;
    transition:all .35s cubic-bezier(.25,.8,.25,1);
  }
  .modal.open .modal-sheet{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  .modal-sheet::before{
    content:""; position:absolute; inset:10px; pointer-events:none;
    border:1px solid var(--line-soft);
  }
  .sheet-corners{position:absolute; inset:0; pointer-events:none;}
  .sheet-corners i{position:absolute; width:18px; height:18px; border:1px solid var(--vintage); opacity:.55;}
  .sheet-corners i:nth-child(1){top:12px;left:12px;border-right:0;border-bottom:0;}
  .sheet-corners i:nth-child(2){top:12px;right:12px;border-left:0;border-bottom:0;}
  .sheet-corners i:nth-child(3){bottom:12px;left:12px;border-right:0;border-top:0;}
  .sheet-corners i:nth-child(4){bottom:12px;right:12px;border-left:0;border-top:0;}
  .sheet-tape{position:absolute; width:110px; height:28px; z-index:2;
    background:rgba(201,185,138,.6); box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .sheet-tape.t1{top:-14px; left:50%; transform:translateX(-50%) rotate(-3deg);}
  .sheet-tape.t2{bottom:-14px; left:50%; transform:translateX(-50%) rotate(2deg);}
  /* 底部胶带在可滚动弹层里会随内容上移压住文字，隐藏 */
  .modal-sheet .sheet-tape.t2{display:none;}

  .sheet-eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px;
    color:var(--vintage); font-weight:700; text-transform:uppercase;}
  .sheet-stamp{display:inline-grid; place-items:center; width:40px; height:40px; border:2px solid var(--vintage);
    border-radius:50%; color:var(--vintage); font-size:12px; letter-spacing:0; transform:rotate(-6deg);
    box-shadow:inset 0 0 0 2px var(--cream), inset 0 0 0 3px var(--vintage);}

  .sheet-title{font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:4px; line-height:1.2; margin-top:16px; color:var(--ink);}
  .sheet-desc{color:var(--ink-muted); font-size:13.5px; margin-top:12px;}

  .sheet-rule{height:1px; background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
    margin:24px 0; border:0;}

  /* 内容块 */
  .block{
    border:1px solid var(--line-soft); background:var(--cream-2);
    padding:16px 18px; margin-bottom:14px;
  }
  .b-title{font-size:12px; letter-spacing:2px; font-weight:700; color:var(--green-deep); margin-bottom:6px;}
  .b-text{font-size:13.5px; color:var(--ink);}
  .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .tags span{font-size:12px; letter-spacing:1px; color:var(--green-deep);
    border:1px solid var(--line); padding:3px 12px; background:var(--cream);}

  /* —— 学习复盘：Emberglow 花园壁纸 + 纸质卡片墙 + p5 微尘/纸屑 —— */
  .modal-sheet.review-sheet{
    width:min(980px, 94vw);
    background-color:#f1ebd9;
    background-image:
      linear-gradient(180deg, rgba(251,248,239,.87) 0%, rgba(250,246,235,.85) 44%, rgba(246,240,226,.91) 100%),
      url("assets/review-garden.webp");
    background-size:cover, cover;
    background-position:center top, center top;
    background-repeat:no-repeat, no-repeat;
  }
  /* 壁纸在页眉处多露出一点，卡片区再由米色压住 */
  .modal-sheet.review-sheet .sheet-eyebrow,
  .modal-sheet.review-sheet .sheet-title,
  .modal-sheet.review-sheet .sheet-desc,
  .modal-sheet.review-sheet .sheet-rule{position:relative; z-index:1;}
  .review-wrap{position:relative;}
  .review-fx{position:absolute; inset:0; z-index:2; pointer-events:none;}
  .review-fx canvas{display:block; pointer-events:none;}
  .review-flow{position:relative; z-index:1; display:flex; flex-direction:column; gap:14px;}
  .review-grid{display:grid; gap:14px;}
  .review-grid-2{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .review-grid-3{grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px;}

  .review-card{
    position:relative; overflow:hidden;
    padding:18px 18px 20px;
    background:linear-gradient(180deg, #fbf8ef 0%, #f2ecdc 100%);
    border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(59,56,47,.07), inset 0 0 0 4px rgba(255,255,255,.32);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.25), box-shadow .35s, border-color .35s;
  }
  .review-card::after{
    content:""; position:absolute; right:0; bottom:0; width:26px; height:26px;
    background:linear-gradient(135deg, transparent 49%, rgba(201,185,138,.32) 50%);
    pointer-events:none;
  }
  .review-card:hover{
    transform:translateY(-5px) rotate(-.35deg);
    border-color:var(--vintage);
    box-shadow:0 16px 34px rgba(59,56,47,.16), inset 0 0 0 4px rgba(255,255,255,.32);
  }
  .rc-overview{background:linear-gradient(135deg, #fbf8ef 0%, #efe6d2 62%, #e8dec6 100%);}
  .rc-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .rc-num{display:inline-grid; place-items:center; width:30px; height:30px; flex:0 0 auto;
    border:1px solid var(--vintage); border-radius:50%; color:var(--green-deep);
    font-size:11px; letter-spacing:0;
    box-shadow:inset 0 0 0 2px #f7f2e4, inset 0 0 0 3px var(--line);}
  .rc-kicker{font-size:9.5px; letter-spacing:3px; color:var(--vintage); text-transform:uppercase;}
  .rc-title{font-size:16px; letter-spacing:1.5px; line-height:1.45; color:var(--green-deep); font-weight:800;}
  .rc-text{margin-top:8px; font-size:13px; line-height:1.9; color:var(--ink);}
  .rc-text b{color:var(--green-deep);}
  .rc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .rc-tags span{font-size:11px; letter-spacing:.5px; color:var(--green-deep);
    border:1px solid var(--line); padding:2px 9px; background:rgba(255,255,255,.45);}
  .rc-stats{display:flex; gap:28px; margin-top:14px;}
  .rc-stats span{display:flex; flex-direction:column; gap:2px;}
  .rc-stats b{font-family:"Courier New", monospace; font-size:30px; line-height:1; color:var(--green-deep);
    font-weight:700; letter-spacing:1px;}
  .rc-stats i{font-style:normal; font-size:11px; letter-spacing:2px; color:var(--ink-muted);}

  /* —— 能力与爱好：悬停/轻触标签 → 弹起并弹出纸质照片 —— */

  .hobby-photo.on{

(function(){
  var IMGS = [
    { f:'12f6de95993b201be67c7d5267645f42.jpg', id:'about',      name:'个人简介' },
    { f:'3e0555ad74af257cc2fdb44bc26ba4a2.jpg', id:'homework',   name:'阶段作业' },
    { f:'monet_garden.jpg', id:'projects',   name:'项目成果' },
    { f:'5e1338cb48c7a7a75e04f9943fbd9220.jpg', id:'evidence',   name:'过程证据' },
    { f:'6fa9a6ad8446f1d4856543adf430ee73.jpg', id:'iterations', name:'迭代记录' },
    { f:'d31aa0ed5bb7239c9398c0404c2a69bd.jpg', id:'review',     name:'学习复盘' }
  ];
  var slides = document.getElementById('slides');
  var dots = document.getElementById('dots');
  var idx = 0, timer = null;

  var caption = document.getElementById('slideCaption');
  var stickerNum = document.getElementById('stickerNum');
  var stickerName = document.getElementById('stickerName');
  IMGS.forEach(function(m, i){
    var im = document.createElement('img');
    im.src = DIR + m.f;
    im.alt = m.name;
    im.title = '点击进入「' + m.name + '」';
    slides.appendChild(im);

    var d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', function(){ go(i); restart(); });
    dots.appendChild(d);
  });
  caption.innerHTML = '点击进入 <b>' + IMGS[0].name + '</b>';
  if (stickerNum) stickerNum.textContent = 'No.01';
  if (stickerName) stickerName.textContent = IMGS[0].name;

  function go(n){
    idx = (n + IMGS.length) % IMGS.length;
    var imgs = slides.children, ds = dots.children;
    for (var i = 0; i < imgs.length; i++) imgs[i].classList.toggle('active', i === idx);
    for (var j = 0; j < ds.length; j++) ds[j].classList.toggle('active', j === idx);
    caption.innerHTML = '点击进入 <b>' + IMGS[idx].name + '</b>';
    if (stickerNum) stickerNum.textContent = 'No.0' + (idx + 1);
    if (stickerName) stickerName.textContent = IMGS[idx].name;
  }
  function next(){ go(idx + 1); }
  function prev(){ go(idx - 1); }
  function restart(){ if (timer) clearInterval(timer); timer = setInterval(next, 3200); }

  document.getElementById('next').addEventListener('click', function(){ next(); restart(); });
  document.getElementById('prev').addEventListener('click', function(){ prev(); restart(); });

  document.addEventListener('keydown', function(e){
    if (document.getElementById('modal').classList.contains('open')) return;
    if (e.key === 'ArrowRight'){ next(); restart(); }
    else if (e.key === 'ArrowLeft'){ prev(); restart(); }
    else if (e.key === 'Enter'){ location.href = '总作业1.html'; }
  });

  /* 点击照片 → 打开模块详情弹层 */
  slides.addEventListener('click', function(){ openModal(IMGS[idx].id); });

  restart();

  /* 章节目录点击 → 打开弹层 */
  document.querySelectorAll('.chapters a').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      openModal(this.getAttribute('data-mod'));
    });
  });
})();

/* 个人简介：p5.js 纸面微尘 + 暖光晕（打开时启动，关闭时清理）
   概念：旧照片用胶带贴在纸上，细小的纸屑与尘埃在暖光里缓慢上浮。 */
var __aboutFx = null, __aboutFxRO = null, __aboutFxDetach = null, __aboutFxWait = null, __aboutFxTries = 0;
function removeAboutFx(){
  clearTimeout(__aboutFxWait); __aboutFxWait = null;
  if (__aboutFxDetach){ try{ __aboutFxDetach(); }catch(e){} __aboutFxDetach = null; }
  if (__aboutFxRO){ try{ __aboutFxRO.disconnect(); }catch(e){} __aboutFxRO = null; }
  if (__aboutFx){ try{ __aboutFx.remove(); }catch(e){} __aboutFx = null; }

/* 首页背景：暖金微尘在叶影里缓慢上浮（与 CSS 背景推拉叠加，不依赖 p5） */
var __homeBg = null;
function initHomeBg(){
  if (__homeBg) return;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduce) return;

  var canvas = document.createElement('canvas');
  canvas.className = 'home-fx';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  __homeBg = canvas;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, motes = [], raf = null, last = 0, tick = 0;
  var GOLD = [201, 185, 138], GREEN = [184, 196, 163];

  function make(init){
    return {
      x: Math.random() * (W || window.innerWidth),
      y: init ? Math.random() * (H || window.innerHeight) : (H || window.innerHeight) + 8 + Math.random() * 22,
      r: 0.7 + Math.random() * 1.7,
      vy: 0.12 + Math.random() * 0.3,
      ph: Math.random() * Math.PI * 2,
      drift: (Math.random() - 0.5) * 0.18,
      a: 0.18 + Math.random() * 0.32,
      gold: Math.random() < 0.72
    };
  }
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  for (var i = 0; i < 44; i++) motes.push(make(true));

  function frame(t){
    raf = requestAnimationFrame(frame);
    if (t - last < 33) return;          // 约 30fps，省电
    last = t;
    tick++;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < motes.length; i++){
      var m = motes[i];
      m.y -= m.vy;
      m.x += Math.sin(tick * 0.016 + m.ph) * 0.22 + m.drift * 0.12;
      if (m.y < -14){ motes[i] = make(false); continue; }
      if (m.x < -14) m.x = W + 14;
      else if (m.x > W + 14) m.x = -14;
      var col = m.gold ? GOLD : GREEN;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + (m.a * 0.16) + ')';
      ctx.arc(m.x, m.y, m.r * 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + m.a + ')';
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  raf = requestAnimationFrame(frame);

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      if (raf){ cancelAnimationFrame(raf); raf = null; }
    } else if (!raf){
      last = 0;
      raf = requestAnimationFrame(frame);
    }
  });
}

/* 首页风动（p5.js）：把叶影背景切成 列 × 行 的小块重绘
   - 环境风：两层 Perlin 噪声，缓慢推着叶框呼吸
   - 指针阵风：指针附近的高斯风场，移动越快风越大
   - 触叶波纹：指针掠过四周叶片时，荡开一圈圈涟漪
   - 叶面微光：指针落在叶片区域时，叶面泛起一层暖光 */
var __windP5 = null, __wind = null, __windTries = 0;

function initWindFx(){
  if (__windP5) return;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduce) return;
  if (!window.p5){                                  // CDN 晚到：稍后重试
    if (__windTries++ < 80) setTimeout(initWindFx, 250);
    return;
  }
  var host = document.getElementById('windFx');
  if (!host || host.querySelector('canvas')) return;

  __windP5 = new p5(function(p){
    var img = null, ready = false;
    var W = 0, H = 0, COLS = 56, ROWS = 3;
    var px = .5, py = .5, fx = .5, fy = .5;
    var gust = 0, lastX = 0, lastY = 0, lastT = 0, moved = false;
    var ripples = [], lastRipple = 0;

    function layout(){
      W = window.innerWidth; H = window.innerHeight;
      if (p.width !== W || p.height !== H) p.resizeCanvas(W, H);
      COLS = W < 760 ? 34 : 56;
      ROWS = H < 620 ? 2 : 3;
    }

    p.setup = function(){
      var c = p.createCanvas(window.innerWidth, window.innerHeight);
      c.parent(host);
      p.pixelDensity(1);
      p.frameRate(30);
      p.noStroke();
      layout();
      p.loadImage('assets/mint-silence-bg.webp', function(im){
        if (!im || !im.width) return;
        img = im;
        ready = true;
        document.body.classList.add('wind-on');
        __wind = host;
      });
    };

    p.windowResized = layout;

    p.draw = function(){
      p.background('#170a0e');
      if (!ready) return;

      var t = p.millis() / 1000;
      fx = p.lerp(fx, px, .05);
      fy = p.lerp(fy, py, .05);
      gust *= .932;

      // 叶框区域：越靠边越"有叶子"，反应越明显
      var edgeX = p.constrain((Math.abs(fx - .5) * 2 - .5) / .5, 0, 1);
      var edgeY = p.constrain((Math.abs(fy - .5) * 2 - .42) / .58, 0, 1);
      var touch = Math.max(edgeX, edgeY);

      var zoom = 1.10 + .012 * Math.sin(t * .12);
      var s = Math.max(W / img.width, H / img.height) * zoom;
      var iw = img.width * s, ih = img.height * s;
      var ox = (W - iw) / 2 + Math.sin(t * .07) * W * .006;
      var oy = (H - ih) / 2 + Math.cos(t * .06) * H * .006;
      var cw = iw / COLS, ch = ih / ROWS;

      for (var j = 0; j < ROWS; j++){
        for (var i = 0; i < COLS; i++){
          var nx = (i + .5) / COLS, ny = (j + .5) / ROWS;
          var edge = Math.max(Math.pow(Math.abs(nx - .5) * 2, 1.25),
                              Math.pow(Math.abs(ny - .5) * 2, 1.5));
          var w = .26 + .74 * edge;

          // 两层噪声：一层大范围气流，一层细碎叶尖抖动
          var n1 = p.noise(nx * 2.3 - t * .16, ny * 1.7 + t * .05) - .5;
          var n2 = p.noise(nx * 5.6 + 30, ny * 4.2 + t * .18) - .5;
          var ambX = (n1 * 15 + n2 * 5) * w;
          var ambY = (n1 * 6 + n2 * 3) * w;

          // 指针风场：dx·e^(-d²k) 在指针处归零，不会撕开画面
          var dx = nx - fx, dy = ny - fy;
          var d2 = dx * dx + dy * dy;
          var g = Math.exp(-d2 * 30);
          var power = g * (1.0 + gust * 6.0) * (1 + touch * 1.4);
          var dX = dx * power * 20;
          var dY = dy * power * 12;
          // 轻微旋转，像枝叶被拨开后的回弹
          var swirl = g * (gust * 5 + .25) * (1 + touch);
          dX += -dy * swirl * 4;
          dY +=  dx * swirl * 4;

          // 触叶波纹：从指针向外扩散的涟漪
          for (var k = 0; k < ripples.length; k++){
            var rp = ripples[k];
            var rx = nx - rp.x, ry = ny - rp.y;
            var dist = Math.sqrt(rx * rx + ry * ry) + 1e-4;
            var ring = dist - rp.age * .34;
            var wave = Math.sin(ring * 24) * Math.exp(-ring * ring * 26) *
                       Math.exp(-rp.age * 2.1) * rp.power * 11;
            dX += (rx / dist) * wave;
            dY += (ry / dist) * wave;
          }

          // 缓慢的镜头呼吸 + 指针带来的整体偏移
          dX += (fx - .5) * 9 * w;
          dY += (fy - .5) * 4 * w;
          dX = p.constrain(dX, -24, 24);
          dY = p.constrain(dY, -14, 14);

          var sx0 = img.width * i / COLS;
          var sw = Math.min(img.width - sx0, img.width / COLS + 2);
          var sy0 = img.height * j / ROWS;
          var sh = Math.min(img.height - sy0, img.height / ROWS + 2);
          // 注意 p5 的 9 参数顺序：目标矩形在前，源矩形在后
          p.image(img,
            ox + i * cw + dX, oy + j * ch + dY, cw + 2, ch + 2,
            sx0, sy0, sw, sh);
        }
      }

      // 指针落在叶片上：叶面泛起一层很淡的暖光
      if (touch > .02 && gust > .015){
        var gx = fx * W, gy = fy * H;
        var rad = 90 + gust * 130;
        var ctx = p.drawingContext;
        var grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
        grd.addColorStop(0, 'rgba(214,199,155,' + (0.13 * touch * gust).toFixed(3) + ')');
        grd.addColorStop(.55, 'rgba(184,196,163,' + (0.06 * touch * gust).toFixed(3) + ')');
        grd.addColorStop(1, 'rgba(184,196,163,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(gx, gy, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      for (var r = ripples.length - 1; r >= 0; r--){
        ripples[r].age += .016;
        if (ripples[r].age > 1.3) ripples.splice(r, 1);
      }
    };

    window.addEventListener('pointermove', function(e){
      if (!ready) return;
      var now = performance.now();
      var nx = e.clientX / Math.max(1, W);
      var ny = e.clientY / Math.max(1, H);
      if (moved){
        var dt = Math.max(16, now - lastT);
        var sp = Math.hypot(e.clientX - lastX, e.clientY - lastY) / dt;  // px/ms
        gust = Math.max(gust, Math.min(1, sp / 2.0));
        var near = Math.max(
          Math.min(1, Math.max(0, (Math.abs(nx - .5) * 2 - .46) / .54)),
          Math.min(1, Math.max(0, (Math.abs(ny - .5) * 2 - .40) / .60))
        );
        if (sp > .45 && near > .12 && now - lastRipple > 110){
          ripples.push({ x: nx, y: ny, age: 0, power: Math.min(1, sp / 2.2) });
          if (ripples.length > 6) ripples.shift();
          lastRipple = now;
        }
      } else {
        moved = true;
      }
      lastX = e.clientX; lastY = e.clientY; lastT = now;
      px = nx; py = ny;
    }, { passive: true });

    window.addEventListener('pointerdown', function(e){
      if (!ready) return;
      px = e.clientX / Math.max(1, W);
      py = e.clientY / Math.max(1, H);
      gust = 1;
      ripples.push({ x: px, y: py, age: 0, power: 1 });
      if (ripples.length > 6) ripples.shift();
    }, { passive: true });
  }, host);
}
initWindFx();

function initAboutFx(){
  var host = document.getElementById('aboutFx');
  if (!host){ __aboutFxTries = 0; removeAboutFx(); return; }   // 弹层已关闭
  if (!window.p5){                                 // CDN 可能晚于弹窗动画到达
    if (__aboutFxTries++ > 300){ __aboutFxTries = 0; return; } // 兜底等待约 36s
    clearTimeout(__aboutFxWait);
    __aboutFxWait = setTimeout(initAboutFx, 120);
    return;
  }
  __aboutFxTries = 0;
  removeAboutFx();
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var COLORS = { ink:[59,56,47], green:[111,125,94], gold:[201,185,138] };  // 取自页面 :root 配色

  __aboutFx = new p5(function(p){
    var W = 0, H = 0, hx = 0, hy = 0, hr = 200;
    var motes = [], sprite = null, t0 = 0;
    var px = 0, py = 0, tx = 0, ty = 0;   // 指针视差（缓动）
    var LAYERS = 3;

    function measure(){
      W = Math.max(180, host.clientWidth || 0);
      H = Math.max(180, host.clientHeight || 0);
      var ph = host.parentNode && host.parentNode.querySelector('.about-portrait');
      if (ph){
        var hb = host.getBoundingClientRect(), pb = ph.getBoundingClientRect();
        hx = pb.left - hb.left + pb.width / 2;
        hy = pb.top - hb.top + pb.height / 2;
        hr = Math.max(pb.height * 0.72, 150);
      } else {
        hx = W * 0.24; hy = H * 0.5; hr = Math.max(H * 0.65, 150);
      }
    }
    /* 一次性生成柔边光点精灵，避免每帧用 filter:blur */
    function makeSprite(){
      var g = p.createGraphics(64, 64);
      g.pixelDensity(1);
      g.clear();
      var ctx = g.drawingContext;
      var grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.4, 'rgba(255,255,255,0.6)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 64, 64);
      sprite = g;
    }
    function seed(){
      motes = [];
      for (var i = 0; i < 64; i++){
        var z = i % LAYERS;                 // 0 近 / 2 远，远层更虚更慢
        motes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          z: z,
          r: (z === 0 ? 6 : z === 1 ? 13 : 24) * (0.55 + Math.random() * 0.9),
          sp: 0.10 + z * 0.10 + Math.random() * 0.08,
          a: 0.05 + Math.random() * 0.07 + z * 0.015,
          s: Math.random() * 1000
        });
      }
    }
    function halo(t){
      var breathe = 0.5 + 0.5 * Math.sin(t * 0.55);
      var ctx = p.drawingContext;
      var cx = hx + px * 5, cy = hy + py * 4;
      ctx.save();
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
      g.addColorStop(0, 'rgba(201,185,138,' + (0.13 + breathe * 0.05).toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(201,185,138,0.045)');
      g.addColorStop(1, 'rgba(201,185,138,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    p.setup = function(){
      measure();
      p.pixelDensity(1);                    // 环境动效不需要 retina 过采样
      var c = p.createCanvas(W, H);
      c.parent(host);
      c.style('position', 'absolute');
      c.style('left', '0');
      c.style('top', '0');
      p.frameRate(30);
      p.noStroke();
      makeSprite();
      seed();
      t0 = p.millis();

      if (reduce){
        p.noLoop();
        p.redraw();                         // 仅静止渲染一帧
      } else {
        var hero = host.parentNode;
        if (hero){
          var onMove = function(e){
            var b = host.getBoundingClientRect();
            tx = ((e.clientX - b.left) / Math.max(1, b.width) - 0.5) * 2;
            ty = ((e.clientY - b.top) / Math.max(1, b.height) - 0.5) * 2;
          };
          hero.addEventListener('pointermove', onMove);
          __aboutFxDetach = function(){ hero.removeEventListener('pointermove', onMove); };
        }
      }

      if (window.ResizeObserver){
        __aboutFxRO = new ResizeObserver(function(){
          var nw = Math.max(180, host.clientWidth || 0);
          var nh = Math.max(180, host.clientHeight || 0);
          if (Math.abs(nw - W) > 2 || Math.abs(nh - H) > 2){
            measure(); p.resizeCanvas(W, H); seed();
            if (reduce) p.redraw();
          }
        });
        __aboutFxRO.observe(host);
      }
    };

    p.draw = function(){
      var t = (p.millis() - t0) / 1000;
      px += (tx - px) * 0.045;
      py += (ty - py) * 0.045;
      p.clear();
      halo(t);

      for (var i = 0; i < motes.length; i++){
        var m = motes[i];
        m.y -= m.sp * (0.55 + p.noise(m.s, t * 0.22) * 0.9);
        m.x += (p.noise(m.s + 37, t * 0.18) - 0.5) * 0.9 * (m.z + 1);
        if (m.y < -40){ m.y = H + 40; m.x = Math.random() * W; }
        if (m.x < -40) m.x = W + 40; else if (m.x > W + 40) m.x = -40;

        var off = (m.z + 1) * 2.6;
        var col = m.z === 0 ? COLORS.ink : (m.z === 1 ? COLORS.green : COLORS.gold);
        var tw = 0.7 + 0.3 * Math.sin(t * 1.3 + m.s);
        p.tint(col[0], col[1], col[2], m.a * tw * 255);
        p.image(sprite, m.x + px * off - m.r, m.y + py * off - m.r, m.r * 2, m.r * 2);
      }
      p.noTint();
    };
  });
}

/* ============================================================
   个人简介：GPA / 专业排名数字滚动（打开时播放，轻触可重播）
   ============================================================ */
function initAboutIntro(){
  var wrap = document.querySelector('#modContent .about-stats');
  if (!wrap) return;
  var stats = wrap.querySelectorAll('.about-stat[data-count]');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function run(el){
    var num = el.querySelector('.num');
    if (!num) return;
    var target = parseFloat(el.getAttribute('data-count'));
    var dec = parseInt(el.getAttribute('data-decimals') || '0', 10);
    if (!isFinite(target)) return;
    if (reduce){ num.textContent = dec ? target.toFixed(dec) : String(target); return; }

    el.classList.remove('is-settled');
    el.classList.add('is-counting');
    var t0 = null;
    function step(now){
      if (el.isConnected === false){ el.classList.remove('is-counting'); return; }
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / 1100);
      var e = 1 - Math.pow(1 - k, 3);
      var v = target * e;
      num.textContent = dec ? v.toFixed(dec) : String(Math.round(v));
      if (k < 1){
        requestAnimationFrame(step);
      } else {
        num.textContent = dec ? target.toFixed(dec) : String(target);
        el.classList.remove('is-counting');
        el.classList.add('is-settled');
        setTimeout(function(){ if (el.isConnected !== false) el.classList.remove('is-settled'); }, 620);
      }
    }
    requestAnimationFrame(step);
  }

  for (var i = 0; i < stats.length; i++){
    (function(el, i){
      setTimeout(function(){ if (el.isConnected !== false) run(el); }, reduce ? 0 : 320 + i * 160);
    })(stats[i], i);
  }

  /* 轻触 / 点击数字可以重播一次滚动 */
  wrap.addEventListener('pointerdown', function(e){
    var el = e.target.closest ? e.target.closest('.about-stat[data-count]') : null;
    if (el) run(el);
  });
}

/* ============================================================
   个人简介：p5 纸屑粒子层（悬停 GPA / 排名 / 爱好标签时迸出）
   整层是一张 fixed 透明画布，坐标用视口坐标计算，
   弹层内部滚动时粒子仍从元素当前位置迸出。
   ============================================================ */
var __sparkFx = null, __sparkWait = null, __sparkTries = 0, __sparkDetach = null;
function removeAboutSpark(){
  clearTimeout(__sparkWait); __sparkWait = null;
  if (__sparkDetach){ try{ __sparkDetach(); }catch(e){} __sparkDetach = null; }
  if (__sparkFx){ try{ __sparkFx.remove(); }catch(e){} __sparkFx = null; }
}
function initAboutSpark(){
  var host = document.getElementById('aboutSpark');
  if (!host || !document.getElementById('aboutFx')){ __sparkTries = 0; removeAboutSpark(); return; }
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduce){ removeAboutSpark(); return; }
  if (!window.p5){                                  // CDN 可能晚于弹窗动画到达
    if (__sparkTries++ > 300){ __sparkTries = 0; return; }
    clearTimeout(__sparkWait);
    __sparkWait = setTimeout(initAboutSpark, 120);
    return;
  }
  __sparkTries = 0;
  removeAboutSpark();

  var particles = [], rings = [], MAX = 170;
  var PALETTE = [[201,185,138], [201,185,138], [111,125,94], [59,56,47], [244,238,224]];

  function addParticle(x, y, power){
    if (particles.length >= MAX) particles.shift();
    var c = PALETTE[(Math.random() * PALETTE.length) | 0];
    var ang = Math.random() * Math.PI * 2;
    var sp = (0.5 + Math.random() * 1.7) * power;
    var life = 26 + Math.random() * 30;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 0.5,
      life: life, max: life,
      size: 1.5 + Math.random() * 3.2,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.16,
      c: c,
      shape: Math.random() < 0.22 ? 2 : (Math.random() < 0.5 ? 0 : 1),
      sway: Math.random() * 1000
    });
  }
  function addRing(x, y, r){
    rings.push({ x: x, y: y, r: Math.max(10, r), life: 1 });
  }
  function burst(x, y, n, power){
    for (var i = 0; i < n; i++) addParticle(x, y, power || 1);
    addRing(x, y, 24 * (power || 1));
  }

  __sparkFx = new p5(function(p){
    var W = 0, H = 0, t = 0;

    p.setup = function(){
      W = Math.max(320, window.innerWidth);
      H = Math.max(320, window.innerHeight);
      p.pixelDensity(1);
      var c = p.createCanvas(W, H);
      c.parent(host);
      c.style('position', 'absolute');
      c.style('left', '0');
      c.style('top', '0');
      p.frameRate(30);
      p.noStroke();
      t = 0;
    };

    p.windowResized = function(){
      W = Math.max(320, window.innerWidth);
      H = Math.max(320, window.innerHeight);
      p.resizeCanvas(W, H);
    };

    p.draw = function(){
      if (!document.getElementById('aboutFx')){ p.clear(); return; }   // 弹层已关
      p.clear();
      t += 1 / 30;

      /* 扩散圆环 */
      for (var i = rings.length - 1; i >= 0; i--){
        var rg = rings[i];
        rg.r += 1.5;
        rg.life -= 0.045;
        if (rg.life <= 0){ rings.splice(i, 1); continue; }
        p.noFill();
        p.stroke(201, 185, 138, 110 * rg.life);
        p.strokeWeight(1);
        p.ellipse(rg.x, rg.y, rg.r * 2, rg.r * 2);
      }
      p.noStroke();

      /* 纸屑：圆点 / 小纸条 / 四角星 */
      for (var j = particles.length - 1; j >= 0; j--){
        var q = particles[j];
        q.life -= 1;
        if (q.life <= 0){ particles.splice(j, 1); continue; }
        q.vx *= 0.965;
        q.vy = q.vy * 0.965 - 0.012;
        q.x += q.vx + Math.sin(t * 1.6 + q.sway) * 0.16;
        q.y += q.vy;
        q.rot += q.vr;
        var a = Math.min(1, q.life / q.max * 1.6) * 172;
        p.fill(q.c[0], q.c[1], q.c[2], a);
        if (q.shape === 0){
          p.ellipse(q.x, q.y, q.size, q.size);
        } else if (q.shape === 1){
          p.push(); p.translate(q.x, q.y); p.rotate(q.rot);
          p.rect(-q.size * 0.8, -q.size * 0.34, q.size * 1.6, q.size * 0.68);
          p.pop();
        } else {
          p.push(); p.translate(q.x, q.y); p.rotate(q.rot);
          var s = q.size * 1.5;
          p.beginShape();
          p.vertex(0, -s); p.vertex(s * 0.26, 0); p.vertex(0, s); p.vertex(-s * 0.26, 0);
          p.endShape(p.CLOSE);
          p.pop();
        }
      }

      /* 偶尔飘过一粒微尘，画面不死 */
      if (particles.length < 20 && Math.random() < 0.02){
        var sheet = document.querySelector('#modal .modal-sheet');
        if (sheet){
          var b = sheet.getBoundingClientRect();
          addParticle(b.left + Math.random() * b.width, b.bottom - 20, 0.25);
        }
      }
    };
  });

  /* 命中判断：只有个人简介里的数字与爱好标签才冒纸屑 */
  function targetFrom(el){
    if (!el || !el.closest) return null;
    var t = el.closest('.about-stat, .hobby-chip');
    if (!t) return null;
    var content = document.getElementById('modContent');
    return content && content.contains(t) ? t : null;
  }
  var lastMove = 0;
  function onOver(e){
    if (e.pointerType === 'touch') return;
    var t = targetFrom(e.target);
    if (!t) return;
    var r = t.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 14, 1);
  }
  function onMove(e){
    if (e.pointerType === 'touch') return;
    if (!targetFrom(e.target)) return;
    var now = Date.now();
    if (now - lastMove < 55) return;
    lastMove = now;
    addParticle(e.clientX, e.clientY, 0.6);
  }
  function onDown(e){
    var t = targetFrom(e.target);
    if (!t) return;
    var r = t.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 20, 1.25);
  }
  document.addEventListener('pointerover', onOver);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerdown', onDown);
  __sparkDetach = function(){
    document.removeEventListener('pointerover', onOver);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerdown', onDown);
  };
}

/* ============================================================
   学习复盘：p5.js 纸面微尘 + 卡片悬停纸屑
   卡片墙本身用 CSS 排布；p5 画布铺在卡片后方，
   细尘缓慢上浮，鼠标掠过卡片时在落点迸出少量纸屑。
   ============================================================ */
var __reviewFx = null, __reviewFxRO = null, __reviewFxDetach = null, __reviewFxWait = null, __reviewFxTries = 0;
function removeReviewFx(){
  clearTimeout(__reviewFxWait); __reviewFxWait = null;
  if (__reviewFxDetach){ try{ __reviewFxDetach(); }catch(e){} __reviewFxDetach = null; }
  if (__reviewFxRO){ try{ __reviewFxRO.disconnect(); }catch(e){} __reviewFxRO = null; }
  if (__reviewFx){ try{ __reviewFx.remove(); }catch(e){} __reviewFx = null; }
}
function initReviewFx(){
  var host = document.getElementById('reviewFx');
  if (!host){ __reviewFxTries = 0; removeReviewFx(); return; }
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduce){ removeReviewFx(); return; }
  if (!window.p5){                                  // CDN 可能晚于弹窗动画到达
    if (__reviewFxTries++ > 300){ __reviewFxTries = 0; return; }
    clearTimeout(__reviewFxWait);
    __reviewFxWait = setTimeout(initReviewFx, 120);
    return;
  }
  __reviewFxTries = 0;
  removeReviewFx();

  var PALETTE = [[201,185,138], [111,125,94], [59,56,47], [214,201,166]];
  __reviewFx = new p5(function(p){
    var W = 0, H = 0, motes = [], sparks = [], t = 0;
    var flow = document.getElementById('reviewFlow');

    function measure(){
      W = Math.max(240, host.clientWidth || 0);
      H = Math.max(240, host.clientHeight || 0);
    }
    function seed(){
      motes = [];
      var n = Math.min(72, Math.max(26, Math.round(W * H / 16000)));
      for (var i = 0; i < n; i++){
        motes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.5 + Math.random() * 1.5,
          sp: 0.10 + Math.random() * 0.26,
          a: 0.10 + Math.random() * 0.22,
          c: PALETTE[(Math.random() * PALETTE.length) | 0],
          s: Math.random() * 1000
        });
      }
    }
    function burst(x, y, n, power){
      for (var i = 0; i < n; i++){
        var c = PALETTE[(Math.random() * PALETTE.length) | 0];
        var ang = Math.random() * Math.PI * 2;
        var sp = (0.35 + Math.random() * 1.5) * power;
        var life = 22 + Math.random() * 26;
        sparks.push({
          x: x, y: y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.35,
          life: life, max: life,
          size: 0.8 + Math.random() * 1.9,
          c: c,
          sway: Math.random() * 1000
        });
      }
      if (sparks.length > 220) sparks.splice(0, sparks.length - 220);
    }

    p.setup = function(){
      measure();
      p.pixelDensity(1);
      var c = p.createCanvas(W, H);
      c.parent(host);
      c.style('position', 'absolute');
      c.style('left', '0');
      c.style('top', '0');
      p.frameRate(30);
      p.noStroke();
      seed();

      /* 卡片悬停 / 划过 → 纸屑迸出 */
      if (flow){
        var lastMove = 0;
        function cardFrom(el){
          return el && el.closest ? el.closest('.review-card') : null;
        }
        function localPoint(e){
          var b = host.getBoundingClientRect();
          return { x: e.clientX - b.left, y: e.clientY - b.top };
        }
        function onOver(e){
          if (e.pointerType === 'touch') return;
          if (!cardFrom(e.target)) return;
          var q = localPoint(e);
          burst(q.x, q.y, 10, 1);
        }
        function onMove(e){
          if (e.pointerType === 'touch') return;
          if (!cardFrom(e.target)) return;
          var now = Date.now();
          if (now - lastMove < 70) return;
          lastMove = now;
          if (Math.random() < 0.55){
            var q = localPoint(e);
            burst(q.x, q.y, 1, 0.5);
          }
        }
        function onDown(e){
          if (!cardFrom(e.target)) return;
          var q = localPoint(e);
          burst(q.x, q.y, 16, 1.15);
        }
        flow.addEventListener('pointerover', onOver);
        flow.addEventListener('pointermove', onMove);
        flow.addEventListener('pointerdown', onDown);
        __reviewFxDetach = function(){
          flow.removeEventListener('pointerover', onOver);
          flow.removeEventListener('pointermove', onMove);
          flow.removeEventListener('pointerdown', onDown);
        };
      }

      if (window.ResizeObserver){
        __reviewFxRO = new ResizeObserver(function(){
          var nw = Math.max(240, host.clientWidth || 0);
          var nh = Math.max(240, host.clientHeight || 0);
          if (Math.abs(nw - W) > 2 || Math.abs(nh - H) > 2){
            W = nw; H = nh;
            p.resizeCanvas(W, H);
            seed();
          }
        });
        __reviewFxRO.observe(host);
      }
    };

    p.draw = function(){
      if (!document.getElementById('reviewFx')){ p.clear(); return; }
      p.clear();
      t += 1 / 30;

      /* 纸面微尘：缓慢上浮，轻微左右游移 */
      for (var i = 0; i < motes.length; i++){
        var m = motes[i];
        m.y -= m.sp * (0.6 + p.noise(m.s, t * 0.22) * 0.9);
        m.x += (p.noise(m.s + 37, t * 0.18) - 0.5) * 0.7;
        if (m.y < -10){ m.y = H + 10; m.x = Math.random() * W; }
        if (m.x < -10) m.x = W + 10; else if (m.x > W + 10) m.x = -10;
        var tw = 0.7 + 0.3 * Math.sin(t * 1.2 + m.s);
        p.fill(m.c[0], m.c[1], m.c[2], m.a * tw * 255);
        p.circle(m.x, m.y, m.r * 2);
      }

      /* 纸屑：轻、有阻力，渐渐淡出 */
      for (var j = sparks.length - 1; j >= 0; j--){
        var q = sparks[j];
        q.life -= 1;
        if (q.life <= 0){ sparks.splice(j, 1); continue; }
        q.vx *= 0.955;
        q.vy = q.vy * 0.955 - 0.008;
        q.x += q.vx + Math.sin(t * 1.6 + q.sway) * 0.12;
        q.y += q.vy;
        var a = Math.min(1, q.life / q.max * 1.7) * 190;
        p.fill(q.c[0], q.c[1], q.c[2], a);
        p.circle(q.x, q.y, q.size * 2);
      }
    };
  });
}

function openModal(key){
  var m = MODS[key];
  if (!m) return;

  document.getElementById('modalBg').style.backgroundImage = "url('" + DIR + m.img + "')";
  document.getElementById('modStamp').textContent = m.num;
  document.getElementById('modTitle').textContent = m.name;
  document.getElementById('modDesc').textContent = m.desc;
  document.getElementById('modContent').innerHTML = m.html;
  var sheet = document.querySelector('#modal .modal-sheet');
  if (sheet) sheet.classList.toggle('review-sheet', key === 'review');
  if (key === 'about'){
    setTimeout(initAboutIntro, 60);
    setTimeout(initAboutFx, 120);
    setTimeout(initAboutSpark, 140);
  } else {
    removeAboutFx();
    removeAboutSpark();
  }
  if (key === 'review'){
    setTimeout(initReviewFx, 160);
  } else {
    removeReviewFx();
  }

  var acts = document.getElementById('modActions');
  acts.innerHTML = '';
  if (m.action) acts.insertAdjacentHTML('beforeend', m.action);
  acts.insertAdjacentHTML('beforeend', '<button class="sheet-btn ghost" id="modCloseBtn" type="button">关闭 <span class="arr">×</span></button>');

  document.getElementById('modal').classList.add('open');
  // display:none 时 scrollTop 不会生效，打开后再归零，避免沿用上一个弹层的位置
  if (sheet) sheet.scrollTop = 0;
  document.body.classList.add('modal-open');
  if (window.lenis) window.lenis.stop();
  history.replaceState(null, '', '?mod=' + key);

  document.getElementById('modCloseBtn').addEventListener('click', closeModal);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.classList.remove('modal-open');
  if (window.lenis) window.lenis.start();
  removeAboutFx();
  removeAboutSpark();
  removeReviewFx();
  var sheet = document.querySelector('#modal .modal-sheet');
  if (sheet) sheet.classList.remove('review-sheet');
  history.replaceState(null, '', location.pathname);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', closeModal);

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')){
    closeModal();
  }
});

/* 页面加载时检查 URL 参数，自动打开对应模块 */
(function(){
  var q = location.search.match(/[?&]mod=([a-z]+)/i);
  if (q && MODS[q[1]]){
    setTimeout(function(){ openModal(q[1]); }, 100);
  }
})();

/* ============================================================
   能力与爱好：悬停 / 轻触标签 → 轻微弹起，并在标签旁弹出一张纸质照片
   ============================================================ */
(function(){
  var card = document.getElementById('hobbyPhoto');
  var img = document.getElementById('hobbyPhotoImg');
  var cap = document.getElementById('hobbyPhotoCap');
  if (!card || !img) return;

  var activeChip = null;

  // 预载照片，第一次悬停时不会闪白
  ['assets/hobby-drama.jpg', 'assets/hobby-food.jpg'].forEach(function(src){
    var i = new Image(); i.src = src;
  });

  function placePhoto(chip){
    var r = chip.getBoundingClientRect();
    var w = card.offsetWidth || 186;
    var h = card.offsetHeight || 214;
    var x = r.left + r.width / 2;
    x = Math.max(w / 2 + 10, Math.min(window.innerWidth - w / 2 - 10, x));
    var below = false;
    var y = r.top - 12;
    if (y - h < 10){ below = true; y = r.bottom + 12; }
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.classList.toggle('below', below);
  }

  function showPhoto(chip){
    var src = chip.getAttribute('data-photo');
    if (img.getAttribute('src') !== src) img.src = src;
    img.alt = chip.textContent + ' 的照片';
    cap.textContent = chip.getAttribute('data-cap') || chip.textContent;
    placePhoto(chip);
    // 先摆好位置再显示，卡片不会从上一张的位置飞过来
    void card.offsetWidth;
    card.classList.add('on');
  }

  function hidePhoto(){ card.classList.remove('on'); }

  function activate(chip){
    if (!chip || activeChip === chip) return;
    if (activeChip) activeChip.classList.remove('is-hot');
    activeChip = chip;
    chip.classList.add('is-hot');
    if (chip.hasAttribute('data-photo')) showPhoto(chip); else hidePhoto();
  }

  function deactivate(chip){
    if (!chip) return;
    chip.classList.remove('is-hot');
    if (activeChip === chip) activeChip = null;
    hidePhoto();
  }

  function chipFrom(el){
    return el && el.closest ? el.closest('.hobby-chip') : null;
  }

  // 鼠标悬停
  document.addEventListener('pointerover', function(e){
    if (e.pointerType === 'touch') return;
    var chip = chipFrom(e.target);
    if (chip) activate(chip);
    else if (activeChip && !card.contains(e.target)) deactivate(activeChip);
  });
  document.addEventListener('pointerout', function(e){
    if (e.pointerType === 'touch') return;
    var chip = chipFrom(e.target);
    if (!chip || chip !== activeChip) return;
    if (chip.contains(e.relatedTarget)) return;          // 还在标签内部
    if (chipFrom(e.relatedTarget)) return;               // 直接移到另一个标签
    deactivate(chip);
  });

  // 触屏轻触 / 键盘焦点
  document.addEventListener('pointerdown', function(e){
    var chip = chipFrom(e.target);
    if (!chip){
      if (activeChip) deactivate(activeChip);
      return;
    }
    if (e.pointerType === 'touch'){
      if (chip === activeChip) deactivate(chip); else activate(chip);
    }
  });
  document.addEventListener('focusin', function(e){
    var chip = chipFrom(e.target);
    if (chip) activate(chip);
  });
  document.addEventListener('focusout', function(e){
    var chip = chipFrom(e.target);
    if (chip) deactivate(chip);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && activeChip) deactivate(activeChip);
  });

  // 弹层内滚动 / 窗口尺寸变化时，卡片跟着标签走
  function reposition(){
    if (activeChip && card.classList.contains('on')) placePhoto(activeChip);
  }
  window.addEventListener('scroll', reposition, true);
  window.addEventListener('resize', reposition);

  // 关闭弹层或换一个模块时收起照片
  function resetHobby(){
    if (activeChip){ activeChip.classList.remove('is-hot'); activeChip = null; }
    hidePhoto();
  }
  var modal = document.getElementById('modal');
  if (modal){
    new MutationObserver(function(){
      if (!modal.classList.contains('open')) resetHobby();
    }).observe(modal, { attributes: true, attributeFilter: ['class'] });
    var content = document.getElementById('modContent');
    if (content) new MutationObserver(resetHobby).observe(content, { childList: true });
  }
})();
</script>

<!-- ========== Lenis 全局平滑阻尼滚动 ========== -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
<script>
/* ============================================================
   Lenis · 全局平滑阻尼滚动（参考 laxspace.co 的滚动手感）
   ============================================================ */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.Lenis || reduce) return;    // CDN 未加载 / 系统减少动效 → 回退原生滚动

  window.lenis = new Lenis({
    duration: 1.2,                        // 阻尼时长，越小越跟手
    easing: function(t){ return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
    smoothWheel: true
  });

  function raf(time){ window.lenis.raf(time); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);

  /* 同页锚点平滑滚动 */
  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!el) return;
    var hash = el.getAttribute('href');
    if (!hash || hash.length < 2) return;
    var target = document.querySelector(hash);
    if (!target) return;
    e.preventDefault();
    window.lenis.scrollTo(target, { duration: 1.4 });
  });
})();
</script>
