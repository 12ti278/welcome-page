<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程作品集 · 幻境回廊</title>
<style>
  /* ============================================================
     莫兰迪绿 · 复古核配色
     ============================================================ */
  :root{
    --bg:           #1e241d;   /* 深橄榄墨绿 · 底色 */
    --bg-soft:      #262c24;   /* 稍浅一档 */
    --surface:      #2c332a;   /* 面板 */
    --surface-2:    #363d33;   /* 内嵌底 */
    --border:       #465042;   /* 灰绿描边 */
    --border-soft:  #38402f;

    --text:         #e6e3d4;   /* 米白（暖调） */
    --text-muted:   #99a08c;   /* 灰绿 · 次要文字 */

    --accent:       #b8c4a3;   /* 鼠尾草绿 · 主强调 */
    --accent-deep:  #8a9a76;   /* 橄榄绿深 */
    --accent-soft:  rgba(184,196,163,.14);

    --vintage:      #c9b98a;   /* 做旧米黄 · 复古点缀 */
    --stamp:        #9a8556;   /* 印章金 */

    --radius:       14px;
    --radius-sm:    8px;
    --shadow:       0 10px 28px rgba(0,0,0,.5);
    --shadow-hover: 0 24px 48px rgba(0,0,0,.7);
    --nav-h:        68px;
    --maxw:         1180px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    font-family:"Courier New","Songti SC","STSong","PingFang SC","Microsoft YaHei",monospace;
    background:var(--bg);
    color:var(--text);
    line-height:1.8;
    letter-spacing:.4px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* 复古核 1：全局胶片颗粒 */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none; z-index:9998;
    opacity:.07;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* 复古核 2：纸张暗角 */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none; z-index:9997;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.35) 100%);
  }

  /* 复古核 3：p5.js 飘落背景 —— 作业素材照片缓缓落下 */
  #fallbg{
    position:fixed; inset:0; z-index:0;
    pointer-events:none; overflow:hidden;
  }
  #fallbg canvas{display:block;position:absolute;top:0;left:0;}

  /* 复古核 4：p5.js 相片墙 —— 宽屏两侧挂绳相片（作业素材照片） */
  #photowall{
    position:fixed; inset:0; z-index:0;
    pointer-events:none; overflow:hidden;
  }
  #photowall canvas{display:block;position:absolute;top:0;left:0;}

  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}

  /* ---------- 顶部导航 ---------- */
  .site-header{
    position:sticky;top:0;z-index:100;
    background:rgba(30,36,29,.85);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
    height:var(--nav-h);
    transition:box-shadow .3s ease,border-color .3s ease;
  }
  .site-header.scrolled{box-shadow:0 6px 30px rgba(0,0,0,.6);border-bottom-color:var(--accent-soft);}
  .nav{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;}

  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;
    background:var(--accent);
    border:1px solid var(--accent-deep);
    display:grid;place-items:center;
    color:#1e241d;font-weight:800;font-size:15px;
    font-family:"Courier New",monospace;
    /* 复古核：细密圆点纹理 */
    background-image:
      radial-gradient(circle at 50% 50%, var(--accent-deep) 1px, transparent 1.4px);
    background-size:6px 6px;
    background-position:0 0;
    position:relative;
  }
  .brand-mark::before{
    content:"P";
    position:absolute; inset:0;
    display:grid; place-items:center;
    background:rgba(184,196,163,.94);
    color:#1e241d;
    font-weight:800;
  }
  .brand-name{font-weight:700;font-size:15px;letter-spacing:3px;}

  .nav-links{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}
  .nav-links a{
    padding:8px 14px;font-size:13px;color:var(--text-muted);
    transition:all .25s ease;white-space:nowrap;
    border-bottom:1px solid transparent;
  }
  .nav-links a:hover{color:var(--accent);border-bottom-color:var(--accent-deep);}
  .nav-links a.active{color:var(--bg);background:var(--accent);font-weight:600;}
  .nav-links a.back-home{color:var(--vintage);}
  .nav-links a.back-home:hover{color:var(--vintage);border-bottom-color:var(--vintage);}

  /* ---------- 主体 ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:0 24px 100px;position:relative;z-index:1;}
  section{padding-top:72px;scroll-margin-top:calc(var(--nav-h) + 20px);}

  .section-head{margin-bottom:36px;text-align:center;}
  .section-eyebrow{
    display:inline-block;font-size:11px;letter-spacing:5px;
    color:var(--vintage);font-weight:600;margin-bottom:14px;
    text-transform:uppercase;
    padding:4px 14px;border:1px solid var(--border-soft);
    background:rgba(201,185,138,.05);
  }
  .section-title{
    font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:3px;
    display:inline-flex;align-items:center;gap:16px;
    color:var(--text);
  }
  .section-title::before,
  .section-title::after{
    content:"";display:inline-block;width:36px;height:1px;
    background:var(--accent-deep);
  }
  .section-desc{margin-top:16px;color:var(--text-muted);font-size:13px;letter-spacing:1.5px;}

  /* ---------- 卡片（复古双线框） ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    position:relative;
    box-shadow:var(--shadow);
    padding:28px 26px;
    transition:transform .35s cubic-bezier(.25,.8,.25,1),box-shadow .35s ease,border-color .35s ease;
  }
  /* 复古核：内嵌细线框 */
  .card::before{
    content:"";position:absolute;inset:6px;
    border:1px solid var(--border-soft);
    pointer-events:none;
    transition:border-color .35s ease;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow-hover);
    border-color:var(--accent);
  }
  .card:hover::before{border-color:var(--accent-soft);}

  .grid{display:grid;gap:24px;}
  .grid--2{grid-template-columns:repeat(2,1fr);}
  .grid--3{grid-template-columns:repeat(3,1fr);}

  .ph-title{
    color:var(--accent);font-weight:700;font-size:15px;
    margin-bottom:12px;letter-spacing:2px;
    display:flex;align-items:center;gap:8px;
  }
  .ph-title::before{
    content:"◆";font-size:9px;color:var(--vintage);
  }
  .ph-text{color:var(--text-muted);font-size:13px;line-height:1.9;}

  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .tag{
    font-size:11px;color:var(--text-muted);
    background:transparent;
    border:1px solid var(--border);
    padding:4px 11px;
    letter-spacing:1px;
    font-family:"Courier New",monospace;
  }
  .tag::before{content:"#";color:var(--vintage);margin-right:2px;}

  .placeholder{
    border:1px dashed var(--border);
    background:var(--surface-2);
    color:var(--text-muted);font-size:13px;
    display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:120px;
    font-family:"Courier New",monospace;
  }
  .placeholder--tall{min-height:200px;}

  /* 复古核：印章式入口按钮 */
  .entry{
    display:inline-flex;align-items:center;gap:10px;margin-top:20px;
    padding:10px 22px;font-size:12px;font-weight:700;
    color:var(--vintage);border:1px solid var(--vintage);
    cursor:pointer;letter-spacing:2px;
    position:relative;
    transition:all .3s ease;
    font-family:"Courier New",monospace;
  }
  .entry::before{
    content:"";position:absolute;inset:3px;
    border:1px solid rgba(201,185,138,.35);
    pointer-events:none;
    transition:border-color .3s ease;
  }
  .entry:hover{background:var(--vintage);color:var(--bg);}
  .entry:hover::before{border-color:rgba(30,36,29,.3);}
  .entry .arrow{transition:transform .3s ease;}
  .entry:hover .arrow{transform:translateX(4px);}

  /* 时间轴（复古核） */
  .timeline{position:relative;padding-left:30px;}
  .timeline::before{
    content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;
    background:repeating-linear-gradient(180deg, var(--accent-deep) 0 4px, transparent 4px 8px);
  }
  .timeline-item{position:relative;padding:0 0 28px 0;}
  .timeline-item::before{
    content:"";position:absolute;left:-27px;top:8px;
    width:10px;height:10px;
    background:var(--bg);border:2px solid var(--accent);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--border-soft);
  }

  .site-footer{
    border-top:1px solid var(--border);
    background:var(--bg-soft);
    padding:40px 24px;text-align:center;
    color:var(--text-muted);font-size:12px;letter-spacing:2px;
    position:relative;z-index:1;
  }
  .site-footer::before{
    content:"✧ ✦ ✧";display:block;color:var(--vintage);letter-spacing:8px;
    margin-bottom:14px;font-size:11px;
  }

  /* ============================================================
     模块画廊 —— 七个板块视觉入口（照片 + 莫奈花园兜底）
     ============================================================ */
  .modules-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;
  }
  @media (max-width:1024px){ .modules-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:720px){ .modules-grid{grid-template-columns:repeat(2,1fr);} }

  .module-card{
    position:relative; display:block; text-decoration:none;
    border:1px solid var(--border); background:var(--surface);
    overflow:hidden; box-shadow:var(--shadow);
    transition:transform .35s cubic-bezier(.25,.8,.25,1), box-shadow .35s ease, border-color .35s ease;
  }
  .module-card:hover{transform:translateY(-6px); border-color:var(--accent); box-shadow:var(--shadow-hover);}
  .module-card::before{ /* 内嵌细线框 */
    content:""; position:absolute; inset:6px; z-index:2;
    border:1px solid var(--border-soft); pointer-events:none;
    transition:border-color .35s ease;
  }
  .module-card:hover::before{border-color:var(--accent-soft);}

  .module-visual{position:relative; height:150px; overflow:hidden;}
  .module-visual img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:sepia(.14) contrast(.98) brightness(.95);
    transition:transform .6s ease;
  }
  .module-card:hover .module-visual img{transform:scale(1.06);}
  .module-visual canvas{position:absolute; top:0; left:0; display:block;}
  .module-visual[data-monet="1"]{ /* 莫奈花园兜底（p5 未加载时的静态渐变） */
    background:
      radial-gradient(ellipse at 30% 30%, rgba(138,154,118,.5), transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(201,185,138,.35), transparent 55%),
      radial-gradient(ellipse at 55% 45%, rgba(165,176,196,.3), transparent 60%),
      linear-gradient(180deg, #2a3327, #1c221b);
  }
  .module-visual::after{ /* 做旧渐变 */
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(201,185,138,.08) 0%, transparent 42%, rgba(30,36,29,.62) 100%);
  }
  .module-num{
    position:absolute; top:10px; left:12px; z-index:3;
    font-size:11px; letter-spacing:2px; color:var(--vintage);
    font-family:"Courier New",monospace;
  }
  .module-label{
    position:relative; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; gap:8px;
    border-top:1px solid var(--border-soft); background:var(--surface);
  }
  .module-name{font-size:14px; font-weight:700; letter-spacing:2px; color:var(--text);}
  .module-arrow{color:var(--accent); font-size:18px; transition:transform .3s ease;}
  .module-card:hover .module-arrow{transform:translateX(5px);}

  /* ============================================================
     阶段作业 · 入口卡片
     ============================================================ */
  .works-entry{
    cursor:pointer;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:32px;
    padding:42px 40px;
    background:linear-gradient(135deg, var(--surface), var(--bg-soft));
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;
  }
  /* 复古核：双线框 */
  .works-entry::before{
    content:"";position:absolute;inset:8px;
    border:1px solid var(--border-soft);
    pointer-events:none;
    transition:border-color .4s ease;
  }
  /* 复古核：角落标记 */
  .works-entry::after{
    content:"";position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;
    pointer-events:none;
    background:
      linear-gradient(90deg, var(--vintage) 0 14px, transparent 14px) top left / 40px 1px no-repeat,
      linear-gradient(180deg, var(--vintage) 0 14px, transparent 14px) top left / 1px 40px no-repeat,
      linear-gradient(270deg, var(--vintage) 0 14px, transparent 14px) top right / 40px 1px no-repeat,
      linear-gradient(180deg, var(--vintage) 0 14px, transparent 14px) top right / 1px 40px no-repeat;
    opacity:.5;
    transition:opacity .4s ease;
  }
  .works-entry:hover{
    transform:translateY(-6px);
    box-shadow:0 24px 50px rgba(184,196,163,.14);
    border-color:var(--accent);
  }
  .works-entry:hover::before{border-color:var(--accent-soft);}
  .works-entry:hover::after{opacity:1;}

  .works-entry-inner{position:relative;z-index:2;min-width:0;}
  .works-entry-kicker{
    display:inline-block;font-size:10px;letter-spacing:5px;
    color:var(--vintage);font-weight:700;margin-bottom:12px;
    padding:3px 10px;border:1px solid var(--border-soft);
    background:rgba(201,185,138,.06);
  }
  .works-entry-title{
    font-size:clamp(22px,3.4vw,30px);font-weight:700;
    letter-spacing:2px;color:var(--text);
    margin-bottom:8px;
  }
  .works-entry-desc{color:var(--text-muted);font-size:13px;letter-spacing:1.5px;}
  .works-entry-desc b{color:var(--accent);font-weight:700;}

  .works-entry-preview{
    position:relative;flex:0 0 auto;z-index:2;width:230px;height:140px;
  }
  .wep-card{
    position:absolute;top:50%;left:50%;
    width:132px;height:112px;overflow:hidden;
    border:1px solid var(--border);
    background:var(--surface-2);
    box-shadow:0 14px 26px rgba(0,0,0,.5);
    transition:transform .5s cubic-bezier(.25,.8,.25,1);
    /* 复古核：做旧边缘 */
    filter:sepia(.15) contrast(.95);
  }
  .wep-card img{
    width:100%;height:100%;object-fit:cover;object-position:top;
    display:block;filter:brightness(.92) contrast(1.05);
  }
  .wep-card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(201,185,138,.06) 0%, transparent 40%, rgba(0,0,0,.55));
    pointer-events:none;
  }
  .wep-card:nth-child(1){transform:translate(-50%,-50%) rotate(-10deg);z-index:1;}
  .wep-card:nth-child(2){transform:translate(-50%,-50%) rotate(-2deg);z-index:2;}
  .wep-card:nth-child(3){transform:translate(-50%,-50%) rotate(7deg);z-index:3;}
  .works-entry:hover .wep-card:nth-child(1){transform:translate(-90%,-52%) rotate(-16deg);}
  .works-entry:hover .wep-card:nth-child(2){transform:translate(-50%,-54%) rotate(-3deg);}
  .works-entry:hover .wep-card:nth-child(3){transform:translate(-10%,-50%) rotate(12deg);}

  .works-entry-arrow{
    position:relative;z-index:2;flex:0 0 auto;font-size:26px;
    color:var(--accent);transition:transform .4s ease;
  }
  .works-entry:hover .works-entry-arrow{transform:translateX(10px);}

  @media (max-width:640px){
    .works-entry{flex-direction:column;align-items:flex-start;padding:30px 24px;}
    .works-entry-preview{width:100%;height:130px;margin-top:12px;}
    .works-entry-arrow{display:none;}
  }

  /* ============================================================
     作品目录全屏层
     ============================================================ */
  .works-overlay{
    position:fixed;inset:0;z-index:1000;
    background:var(--bg-soft);
    transform:translateY(100%);
    transition:transform .6s cubic-bezier(.76,0,.24,1);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .works-overlay.open{transform:translateY(0);}

  .works-overlay-top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    background:rgba(30,36,29,.92);
    position:relative;
  }
  .works-overlay-title{
    font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:3px;
    display:flex;align-items:baseline;gap:14px;color:var(--text);
    font-family:"Courier New",monospace;
  }
  .works-overlay-title small{
    font-size:12px;font-weight:400;letter-spacing:5px;color:var(--vintage);
    font-family:"Courier New",monospace;
  }
  .works-close{
    flex:0 0 auto;width:44px;height:44px;
    border:1px solid var(--border);
    background:transparent;color:var(--text);
    cursor:pointer;display:grid;place-items:center;
    transition:all .35s ease;
  }
  .works-close:hover{
    background:var(--accent);color:var(--bg);
    transform:rotate(90deg);border-color:var(--accent);
  }

  .tape-stage{
    flex:1;position:relative;overflow:hidden;
    display:grid;place-items:center;padding:24px;
  }
  .tape3d{
    position:absolute;inset:0;z-index:2;width:100%;height:100%;
    display:block;cursor:grab;touch-action:none;
  }
  .tape3d.grabbing{cursor:grabbing;}
  .tape-trail{
    position:absolute;inset:0;z-index:1;width:100%;height:100%;
    display:block;pointer-events:none;
  }

  /* 复古核：HUD */
  .works-tape-hint{
    position:absolute;right:22px;bottom:20px;z-index:3;
    display:flex;gap:8px;align-items:center;pointer-events:none;
    flex-wrap:wrap;justify-content:flex-end;
  }
  .hud-chip{
    font-size:10.5px;letter-spacing:1.5px;color:var(--text-muted);
    background:rgba(30,36,29,.85);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--border);
    padding:5px 12px;
    font-variant-numeric:tabular-nums;
    font-family:"Courier New",monospace;
  }
  .hud-chip b{color:var(--accent);font-weight:700;}
  .hud-chip.warn{border-color:#a44;color:#e8a8a8;}
  .hud-chip.warn b{color:#e8a8a8;}

  @media (max-width:1024px){.grid--3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:768px){
    :root{--nav-h:60px;}
    .grid--3,.grid--2{grid-template-columns:1fr;}
    main{padding:0 18px 60px;}
    .works-overlay-top{padding:14px 18px;}
    .works-tape-hint{right:10px;bottom:10px;}
    .hud-chip{font-size:10px;padding:4px 9px;}
  }
</style>
</head>
<body>

<div id="fallbg" aria-hidden="true"></div>
<div id="photowall" aria-hidden="true"></div>

<header class="site-header" id="top">
  <nav class="nav">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">幻境回廊</span>
    </div>
    <ul class="nav-links">
      <li><a href="welcome.html" class="back-home">← Welcome</a></li>
      <li><a href="welcome.html?mod=about">个人简介</a></li>
      <li><a href="welcome.html?mod=homework">阶段作业</a></li>
      <li><a href="welcome.html?mod=projects">项目成果</a></li>
      <li><a href="welcome.html?mod=evidence">过程证据</a></li>
      <li><a href="welcome.html?mod=iterations">迭代记录</a></li>
      <li><a href="welcome.html?mod=review">学习复盘</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="modules">
    <header class="section-head">
      <span class="section-eyebrow">00 · Modules</span>
      <h2 class="section-title">模块导航</h2>
      <p class="section-desc">七个板块 · 点击进入对应模块</p>
    </header>
    <div class="modules-grid" id="modulesGrid"></div>
  </section>

(function renderEntryPreview(){
  const host = document.getElementById('worksEntryPreview');
  if (!host) return;
  WORKS.slice(0, 3).forEach(function(w){
    const d = document.createElement('div');
    d.className = 'wep-card';
    const img = document.createElement('img');
    img.src = w.thumb; img.alt = ''; img.loading = 'lazy';
    img.onerror = function(){ this.style.display = 'none'; };
    d.appendChild(img);
    host.appendChild(d);
  });

function openWorks(){

  worksOverlay.setAttribute('aria-hidden', 'false');

}
function closeWorks(){

});

/* 导航高亮 */
(function(){
  const links = document.querySelectorAll('.nav-links a');
  const map = {};
  links.forEach(function(a){
    const id = a.getAttribute('href').slice(1);
    const sec = document.getElementById(id);
    if (sec) map[id] = sec;
  });
  function onScroll(){
    const pos = window.scrollY + 120;
    let current = null;
    Object.keys(map).forEach(function(id){
      if (map[id].offsetTop <= pos) current = id;
    });
    links.forEach(function(a){
      a.classList.toggle('active', current && a.getAttribute('href') === '#'+current);
    });
  }
  window.addEventListener('scroll', onScroll); onScroll();
  const header = document.querySelector('.site-header');

    header.classList.toggle('scrolled', window.scrollY > 8);
  });
})();

/* ============================================================
   预加载三张网页截图
   ============================================================ */
const workImages = [];

function preloadAll(cb){
  let n = 0;
  const total = WORKS.length;
  if (total === 0) { cb(); return; }
  WORKS.forEach(function(w, i){
    const img = new Image();
    if (/^https?:\/\//i.test(w.thumb)) img.crossOrigin = 'anonymous';

    function onDone(ok){
      workImages[i] = ok ? img : null;
      const loaded = workImages.filter(Boolean).length;
      const hudLoad = document.getElementById('hudLoad');
      if (hudLoad){
        if (loaded === total){
          hudLoad.innerHTML = '截图 <b>' + loaded + '/' + total + '</b>';
          hudLoad.classList.remove('warn');
        } else if (n + 1 >= total){
          hudLoad.innerHTML = '截图 <b>' + loaded + '/' + total + '</b> · 请检查文件名';
          hudLoad.classList.add('warn');
        }
      }
      if (!ok) console.warn('[作品集] 截图加载失败：' + w.thumb);
      else console.log('[作品集] 截图加载成功：' + w.thumb + ' (' + img.naturalWidth + '×' + img.naturalHeight + ')');
      if (++n === total) cb();
    }

    img.onload = function(){ onDone(true); };
    img.onerror = function(){ onDone(false); };
    img.src = w.thumb;

    setTimeout(function(){
      if (!img.complete || !img.naturalWidth){
        if (workImages[i] === undefined) onDone(false);
      }
    }, 5000);
  });
}

/* ============================================================
   3D 胶带卷 —— 做旧米黄·牛皮纸胶带
   ============================================================ */
function initWorks3D(){
  const stage = document.querySelector('.tape-stage');
  const canvas = document.getElementById('tape3d');
  if (!stage || !canvas) return;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);

  const CAM_BASE = new THREE.Vector3(2.0, 1.4, 6.8);
  const CAM_LOOK = new THREE.Vector3(0, 0, 0);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_LOOK);
  const rollGroup = new THREE.Group();
  scene.add(rollGroup);
  rollGroup.rotation.z = Math.PI / 2;

  const R = 1.25, W = 1.9;          // 胶带更小
  const CORE_R = R * 0.58;          // 镂空纸芯半径（孔更大）

  /* ---------- 拼接三张截图（小贴纸：缩到胶带中间，四周露出牛皮纸底色） ---------- */
  const STRIP_H = 720;
  const PAD = 46;                 // 贴纸内边距（奶油纸框）
  const GAP = 110;                // 贴纸之间露出的牛皮纸胶带
  const PHOTO_H = 400;            // 截图高度（占 720 的约 56%，上下留牛皮纸）
  const INNER_H = PHOTO_H + 2 * PAD;
  const validImgs = workImages.filter(Boolean);
  let stripData = null;
  if (validImgs.length > 0){
    const parts = validImgs.map(function(img){
      const photoW = Math.max(1, Math.round(img.width * PHOTO_H / img.height));
      return { img: img, cellW: photoW + 2 * PAD, photoW: photoW };
    });
    const totalW = parts.reduce(function(s, p){ return s + p.cellW; }, 0) + GAP * (parts.length - 1);
    parts.forEach(function(p, i){ p.w = p.cellW + (i < parts.length - 1 ? GAP : 0); });
    const c = document.createElement('canvas');
    c.width = totalW; c.height = STRIP_H;
    const ctx = c.getContext('2d');

    // 灰白银胶带底：竖向渐变 + 布基凸脊 + 颗粒噪点（浅色系，不黑）
    const bg = ctx.createLinearGradient(0, 0, 0, STRIP_H);
    bg.addColorStop(0, '#f2f2f0');
    bg.addColorStop(0.45, '#dcdcda');
    bg.addColorStop(1, '#b6b6b4');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, totalW, STRIP_H);
    for (let y = 0; y < STRIP_H; y += 3){
      ctx.fillStyle = 'rgba(130,130,128,' + (0.06 + Math.random() * 0.10) + ')';
      ctx.fillRect(0, y, totalW, 1);
    }
    for (let i = 0, n = Math.floor(totalW * STRIP_H / 800); i < n; i++){
      ctx.fillStyle = 'rgba(90,90,88,' + (Math.random() * 0.04) + ')';
      ctx.fillRect(Math.random() * totalW, Math.random() * STRIP_H, 1, 1);
    }

    function rr(x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const topY = (STRIP_H - INNER_H) / 2;
    let ox = 0;
    parts.forEach(function(p, idx){
      const rot = (idx - (parts.length - 1) / 2) * 0.028;   // 中间正、两侧微倾，贴纸感
      const lw = p.cellW, lh = INNER_H;
      ctx.save();
      ctx.translate(ox + lw / 2, topY + lh / 2);
      ctx.rotate(rot);
      // 投影
      ctx.fillStyle = 'rgba(100,100,98,.24)';
      rr(-lw / 2 + 5, -lh / 2 + 7, lw, lh, 16);
      ctx.fill();
      // 浅灰标签纸
      ctx.fillStyle = '#eaeaea';
      rr(-lw / 2, -lh / 2, lw, lh, 16);
      ctx.fill();
      // 描边
      ctx.strokeStyle = 'rgba(120,120,118,.55)';
      ctx.lineWidth = 3;
      rr(-lw / 2 + 1.5, -lh / 2 + 1.5, lw - 3, lh - 3, 15);
      ctx.stroke();
      // 居中贴截图
      ctx.drawImage(p.img, -p.photoW / 2, -PHOTO_H / 2, p.photoW, PHOTO_H);
      ctx.restore();
      ox += p.cellW + GAP;
    });

    // 参差不齐的撕边：上下边缘随机撕裂（真实胶带感）
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    const RAG = 18, RSTEP = 5;
    let ty = RAG * (0.3 + Math.random() * 0.7);
    ctx.beginPath(); ctx.moveTo(0, 0);
    for (let sx = 0; sx <= totalW; sx += RSTEP){
      ty += (Math.random() - 0.5) * 6; ty = Math.max(1, Math.min(RAG, ty));
      ctx.lineTo(sx, ty);
    }
    ctx.lineTo(totalW, 0); ctx.closePath(); ctx.fill();
    ty = RAG * (0.3 + Math.random() * 0.7);
    ctx.beginPath(); ctx.moveTo(0, STRIP_H);
    for (let sx = 0; sx <= totalW; sx += RSTEP){
      ty += (Math.random() - 0.5) * 6; ty = Math.max(1, Math.min(RAG, ty));
      ctx.lineTo(sx, STRIP_H - ty);
    }
    ctx.lineTo(totalW, STRIP_H); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    stripData = { canvas: c, totalW: totalW, height: STRIP_H, parts: parts };
  }

  /* ---------- 侧面纹理 ---------- */
  function makeSideTexture(){
    if (stripData){
      const t = new THREE.CanvasTexture(stripData.canvas);
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      if (t.encoding !== undefined) t.encoding = THREE.sRGBEncoding;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return t;
    }
    return makeKraftTapeTexture();
  }

  /* ---------- 做旧米黄·牛皮纸胶带纹理 ---------- */
  function makeKraftTapeTexture(){
    const CW = 1024, CH = 512;
    const c = document.createElement('canvas');
    c.width = CW; c.height = CH;
    const x = c.getContext('2d');

    // 竖向渐变：灰白 → 银灰 → 深银（银色布基胶带）
    const g = x.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0.00, '#f2f2f0');
    g.addColorStop(0.12, '#e8e8e6');
    g.addColorStop(0.38, '#d8d8d6');
    g.addColorStop(0.55, '#c8c8c6');
    g.addColorStop(0.75, '#b8b8b6');
    g.addColorStop(0.92, '#a8a8a6');
    g.addColorStop(1.00, '#b0b0ae');
    x.fillStyle = g; x.fillRect(0, 0, CW, CH);

    // 横向布基凸脊
    for (let y = 0; y < CH; y += 3){
      x.fillStyle = 'rgba(120,120,118,' + (0.08 + Math.random() * 0.12) + ')';
      x.fillRect(0, y, CW, 1 + Math.random() * 2);
    }
    for (let y = 1; y < CH; y += 3){
      x.fillStyle = 'rgba(248,248,246,' + (0.06 + Math.random() * 0.10) + ')';
      x.fillRect(0, y, CW, 1);
    }
    // 竖向织物纹
    x.strokeStyle = 'rgba(150,150,148,0.12)';
    for (let i = 0; i <= CW; i += 6){
      x.beginPath(); x.moveTo(i, 0); x.lineTo(i, CH); x.stroke();
    }
    // 颗粒噪点
    for (let i = 0; i < 12000; i++){
      x.fillStyle = 'rgba(80,80,78,' + (Math.random() * 0.04) + ')';
      x.fillRect(Math.random() * CW, Math.random() * CH, 1, 1);
    }
    for (let i = 0; i < 6000; i++){
      x.fillStyle = 'rgba(250,250,248,' + (Math.random() * 0.05) + ')';
      x.fillRect(Math.random() * CW, Math.random() * CH, 1, 1);
    }
    // 复古核：竖向做旧划痕
    for (let i = 0; i < 30; i++){
      x.strokeStyle = 'rgba(140,140,138,' + (0.03 + Math.random()*0.05) + ')';
      x.lineWidth = 0.5 + Math.random();
      const sx = Math.random() * CW;
      x.beginPath(); x.moveTo(sx, 0); x.lineTo(sx + (Math.random()-0.5)*40, CH); x.stroke();
    }

    // 参差不齐撕边
    x.globalCompositeOperation = 'destination-out';
    x.fillStyle = 'rgba(0,0,0,1)';
    const RAG2 = 24, ST2 = 6;
    let ty2 = RAG2 * (0.3 + Math.random() * 0.7);
    x.beginPath(); x.moveTo(0, 0);
    for (let i = 0; i <= CW; i += ST2){
      ty2 += (Math.random() - 0.5) * 8; ty2 = Math.max(1, Math.min(RAG2, ty2));
      x.lineTo(i, ty2);
    }
    x.lineTo(CW, 0); x.closePath(); x.fill();
    ty2 = RAG2 * (0.3 + Math.random() * 0.7);
    x.beginPath(); x.moveTo(0, CH);
    for (let i = 0; i <= CW; i += ST2){
      ty2 += (Math.random() - 0.5) * 8; ty2 = Math.max(1, Math.min(RAG2, ty2));
      x.lineTo(i, CH - ty2);
    }
    x.lineTo(CW, CH); x.closePath(); x.fill();
    x.globalCompositeOperation = 'source-over';

    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (t.encoding !== undefined) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  }

  /* ---------- 卷芯端面：牛皮纸螺旋卷纸 ---------- */
  function makeCapTexture(){
    const S = 256;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    const base = x.createRadialGradient(S/2, S/2, 10, S/2, S/2, S/2);
    base.addColorStop(0, '#f2f2f0');
    base.addColorStop(0.7, '#d4d4d2');
    base.addColorStop(1, '#a8a8a6');
    x.fillStyle = base; x.fillRect(0, 0, S, S);

    const cx = S/2, cy = S/2, N = 2400;
    for (let pass = 0; pass < 2; pass++){
      x.beginPath();
      x.strokeStyle = pass === 0 ? 'rgba(130,130,128,0.5)' : 'rgba(248,248,246,0.55)';
      x.lineWidth = pass === 0 ? 5 : 2;
      const off = pass === 0 ? 0 : 3;
      for (let i = 0; i <= N; i++){
        const th = (i/N) * 9 * Math.PI;
        const rr = 14 + (i/N) * (S/2 - 10);
        const px = cx + (rr + off) * Math.cos(th), py = cy + (rr + off) * Math.sin(th);
        if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
    }
    for (let i = 0; i < 5000; i++){
      x.fillStyle = 'rgba(85,85,83,' + (Math.random() * 0.04) + ')';
      x.fillRect(Math.random() * S, Math.random() * S, 1, 1);
    }
    // 镂空中心：擦成透明（纸芯孔）
    const holeR = (S / 2) * (CORE_R / R);
    x.globalCompositeOperation = 'destination-out';
    x.fillStyle = 'rgba(0,0,0,1)';   // 必须不透明，才能把中心擦成透明
    x.beginPath();
    x.arc(S / 2, S / 2, holeR, 0, Math.PI * 2);
    x.fill();
    x.globalCompositeOperation = 'source-over';
    // 孔缘一圈浅棕描边，暗示纸芯厚度
    x.beginPath();
    x.arc(S / 2, S / 2, holeR, 0, Math.PI * 2);
    x.strokeStyle = 'rgba(110,110,108,.65)';
    x.lineWidth = 5;
    x.stroke();
    const t = new THREE.CanvasTexture(c);
    if (t.encoding !== undefined) t.encoding = THREE.sRGBEncoding;
    return t;
  }

  /* ---------- 纸芯内壁：做旧牛皮纸管 ---------- */
  function makeCoreTexture(){
    const S = 128;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, '#b8b8b6');
    g.addColorStop(0.5, '#a2a2a0');
    g.addColorStop(1, '#8c8c8a');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    for (let i = 0; i < S; i += 2){
      x.fillStyle = 'rgba(120,120,118,' + (0.04 + Math.random() * 0.06) + ')';
      x.fillRect(i, 0, 1, S);
    }
    for (let i = 0; i < 4000; i++){
      x.fillStyle = 'rgba(60,60,58,' + (Math.random() * 0.05) + ')';
      x.fillRect(Math.random() * S, Math.random() * S, 1, 1);
    }
    const t = new THREE.CanvasTexture(c);
    if (t.encoding !== undefined) t.encoding = THREE.sRGBEncoding;
    return t;
  }

  /* ---------- 胶带卷主体 ---------- */
  const roll = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, W, 96, 1, false),
    [
      new THREE.MeshBasicMaterial({ map: makeSideTexture(), side: THREE.DoubleSide, transparent: true }),
      new THREE.MeshBasicMaterial({ map: makeCapTexture(),  side: THREE.DoubleSide, transparent: true }),
      new THREE.MeshBasicMaterial({ map: makeCapTexture(),  side: THREE.DoubleSide, transparent: true })
    ]
  );
  rollGroup.add(roll);

  // 中间镂空纸芯管（开口圆柱，内壁可见 = 镂空）
  const core = new THREE.Mesh(
    new THREE.CylinderGeometry(CORE_R, CORE_R, W, 64, 1, true),
    new THREE.MeshBasicMaterial({ map: makeCoreTexture(), side: THREE.DoubleSide })
  );
  roll.add(core);

  /* ---------- 变化影子：跟随胶带、随自转/拖拽/轨道而变 ---------- */
  const shadowTex = (function makeShadowTexture(){
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(S/2, S/2, S * 0.02, S/2, S/2, S/2);
    g.addColorStop(0, 'rgba(0,0,0,0.72)');
    g.addColorStop(0.5, 'rgba(0,0,0,0.34)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, S, S);
    return new THREE.CanvasTexture(c);
  })();
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(R * 3.8, R * 3.8),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  shadow.frustumCulled = false;
  scene.add(shadow);

  /* ---------- 地面痕迹纹理：与胶带同源 ---------- */
  let trailTexPeriod = (stripData ? (stripData.totalW / stripData.height) * W : 3.2);
  function makeTrailTexture(){
    if (stripData){
      const t = new THREE.CanvasTexture(stripData.canvas);
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      if (t.encoding !== undefined) t.encoding = THREE.sRGBEncoding;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return t;
    }
    return makeKraftTapeTexture();
  }

  /* ---------- 留痕参数（2D 屏幕固定痕迹：印上去就不再动） ---------- */
  const MAX_TRAIL_PTS = 2000;
  const trailCanvas = document.getElementById('tapeTrail');
  const trailCtx = trailCanvas ? trailCanvas.getContext('2d') : null;
  const trailPts = [];            // 屏幕坐标 {x, y}
  let trailHalfWpx = 24;          // 胶带屏幕半宽（px）
  let trailPeriodPx = 400;        // 纹理一个周期的屏幕像素
  let trailU = 0;                 // 累计纹理 u
  const _projV = new THREE.Vector3();

  function resizeTrailCanvas(){
    if (!trailCanvas || !trailCtx) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    trailCanvas.width = Math.max(1, Math.floor(w * dpr));
    trailCanvas.height = Math.max(1, Math.floor(h * dpr));
    trailCanvas.style.width = w + 'px';
    trailCanvas.style.height = h + 'px';
    trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    camera.updateMatrixWorld(true);
    const a = new THREE.Vector3(W / 2, 0, 0).project(camera);
    const b = new THREE.Vector3(-W / 2, 0, 0).project(camera);
    trailHalfWpx = Math.max(2, Math.abs(a.x - b.x) * 0.25 * w);
    trailPeriodPx = trailHalfWpx * 2 * (stripData ? stripData.totalW / stripData.height : 3.2);
    clearTrail();
  }

  function toScreen(wx, wy){
    camera.updateMatrixWorld(true);
    _projV.set(wx, wy, 0).project(camera);
    const w = stage.clientWidth, h = stage.clientHeight;
    return { x: (_projV.x * 0.5 + 0.5) * w, y: (-_projV.y * 0.5 + 0.5) * h };
  }

  function drawTexSegment(p0, p1){
    if (!trailCtx) return;
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const len = Math.hypot(dx, dy);
    if (len < 0.5) return;
    const ang = Math.atan2(dy, dx);
    // 银灰底衬：连续圆角，填满拐角与接缝，让痕迹连贯
    trailCtx.save();
    trailCtx.strokeStyle = '#c8c8c6';
    trailCtx.lineWidth = trailHalfWpx * 2;
    trailCtx.lineCap = 'round';
    trailCtx.lineJoin = 'round';
    trailCtx.beginPath();
    trailCtx.moveTo(p0.x, p0.y);
    trailCtx.lineTo(p1.x, p1.y);
    trailCtx.stroke();
    trailCtx.restore();
    if (stripData){
      const texW = stripData.canvas.width, texH = stripData.canvas.height;
      const du = len / trailPeriodPx;
      let remaining = len, px = p0.x, py = p0.y, u = trailU % 1;
      while (remaining > 0.5){
        const avail = Math.max((1 - u) * trailPeriodPx, 1);
        const segLen = Math.min(remaining, avail);
        const sx = u * texW;
        const srcW = Math.min((segLen / trailPeriodPx) * texW, texW - sx);
        trailCtx.save();
        trailCtx.translate(px, py);
        trailCtx.rotate(ang);
        trailCtx.drawImage(stripData.canvas, sx, 0, srcW, texH, 0, -trailHalfWpx, segLen, trailHalfWpx * 2);
        trailCtx.restore();
        px += Math.cos(ang) * segLen; py += Math.sin(ang) * segLen;
        remaining -= segLen;
        u = 0;
      }
      trailU += du;
    } else {
      trailCtx.save();
      trailCtx.translate(p0.x, p0.y);
      trailCtx.rotate(ang);
      trailCtx.fillStyle = '#c8c8c6';
      trailCtx.fillRect(0, -trailHalfWpx, len, trailHalfWpx * 2);
      trailCtx.restore();
    }
  }

  function addTrailPoint(wx, wy){
    if (!trailCtx || !trailCanvas) return false;
    const sp = toScreen(wx, wy);
    if (trailPts.length === 0){
      trailPts.push(sp);
      trailCtx.save();
      trailCtx.fillStyle = '#c8c8c6';
      trailCtx.beginPath();
      trailCtx.arc(sp.x, sp.y, trailHalfWpx, 0, Math.PI * 2);
      trailCtx.fill();
      trailCtx.restore();
      return true;
    }
    const last = trailPts[trailPts.length - 1];
    const d = Math.hypot(sp.x - last.x, sp.y - last.y);
    if (d < 2) return false;
    const steps = Math.min(Math.ceil(d / 2), 40);
    let cx = last.x, cy = last.y;
    for (let s = 1; s <= steps; s++){
      const t = s / steps;
      const nx = last.x + (sp.x - last.x) * t;
      const ny = last.y + (sp.y - last.y) * t;
      drawTexSegment({x:cx, y:cy}, {x:nx, y:ny});
      trailPts.push({x:nx, y:ny});
      cx = nx; cy = ny;
    }
    if (trailPts.length > MAX_TRAIL_PTS) trailPts.splice(0, trailPts.length - MAX_TRAIL_PTS);
    return true;
  }

  function clearTrail(){
    trailPts.length = 0;
    trailU = 0;
    if (trailCtx){ const w = stage.clientWidth, h = stage.clientHeight; trailCtx.clearRect(0, 0, w, h); }
  }

  /* ---------- 交互状态 ---------- */
  let spin = 0, spinTarget = 0, autoSpin = true;
  let orbitMode = false;
  const orbit = { theta: 0.35, phi: 1.25, radius: 7.6 };
  const camPos = new THREE.Vector3().copy(CAM_BASE);
  const camLook = new THREE.Vector3().copy(CAM_LOOK);
  const camTarget = new THREE.Vector3().copy(CAM_BASE);
  const lookTarget = new THREE.Vector3().copy(CAM_LOOK);
  const ndc = new THREE.Vector2();
  const rollPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const rollTarget = new THREE.Vector3();
  const _rollHit = new THREE.Vector3();
  const hudOrbit = document.getElementById('hudOrbit');
  const hudFps = document.getElementById('hudFps');

  function setOrbit(on){
    orbitMode = on;
    if (hudOrbit) hudOrbit.innerHTML = 'Orbit <b>' + (on ? 'On' : 'Off') + '</b> [Tab]';
  }
  function toggleOrbit(){ setOrbit(!orbitMode); }
  function rewind(){
    spinTarget = 0;
    rollTarget.set(0, 0, 0);
    rollGroup.position.set(0, 0, 0);
    orbit.theta = 0.35; orbit.phi = 1.25; orbit.radius = 7.6;
    clearTrail();
  }
  function applyCamera(){
    if (orbitMode){
      const st = Math.sin(orbit.phi), ct = Math.cos(orbit.phi);
      camTarget.set(orbit.radius*st*Math.sin(orbit.theta), orbit.radius*ct, orbit.radius*st*Math.cos(orbit.theta));
      lookTarget.set(0, 0, 0);
    } else {
      camTarget.copy(CAM_BASE); lookTarget.copy(CAM_LOOK);
    }
  }

  const raycaster = new THREE.Raycaster();
  let dragging = false, downX = 0, downY = 0, startX = 0, startY = 0;

  stage.addEventListener('pointermove', function(e){
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    if (dragging){
      const dx = e.clientX - downX, dy = e.clientY - downY;
      downX = e.clientX; downY = e.clientY;
      if (orbitMode){
        orbit.theta += dx * 0.005;
        orbit.phi = Math.max(0.3, Math.min(1.5, orbit.phi - dy * 0.005));
      } else {
        raycaster.setFromCamera(ndc, camera);
        if (raycaster.ray.intersectPlane(rollPlane, _rollHit)) rollTarget.copy(_rollHit);
      }
    }
  });
  stage.addEventListener('pointerdown', function(e){
    dragging = true; startX = downX = e.clientX; startY = downY = e.clientY;
    canvas.classList.add('grabbing');
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });

  function openByAngle(hitPoint){
    if (!stripData || !stripData.parts) return;
    roll.updateMatrixWorld();
    const local = roll.worldToLocal(hitPoint.clone());
    let a = Math.atan2(local.z, local.x);
    let u = (Math.PI / 2 - a) / (Math.PI * 2);
    u = ((u % 1) + 1) % 1;
    u = (u - spin / (Math.PI * 2));
    u = ((u % 1) + 1) % 1;
    let cum = 0;
    let idx = stripData.parts.length - 1;
    for (let i = 0; i < stripData.parts.length; i++){
      cum += stripData.parts[i].w / stripData.totalW;
      if (u < cum){ idx = i; break; }
    }
    let realIdx = 0, seen = 0;
    for (let i = 0; i < WORKS.length; i++){
      if (workImages[i]){ if (seen === idx){ realIdx = i; break; } seen++; }
    }
    if (WORKS[realIdx]) window.open(WORKS[realIdx].url, '_blank');
  }

  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('grabbing');
    try{ if (e && e.pointerId != null) stage.releasePointerCapture(e.pointerId); }catch(_){}
    if (Math.hypot(e.clientX - startX, e.clientY - startY) >= 6) return;
    const r = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(roll, false);
    if (hits.length){ openByAngle(hits[0].point); }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    if (orbitMode){ orbit.radius = Math.max(5, Math.min(16, orbit.radius * (1 + e.deltaY * 0.001))); }
    else { autoSpin = false; spinTarget += e.deltaY * 0.004; }
  }, { passive: false });

  document.addEventListener('keydown', function(e){
    if (!worksOverlay.classList.contains('open')) return;
    if (e.key === 'Tab'){ e.preventDefault(); toggleOrbit(); }
    else if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); rewind(); }
  });

  /* ---------- 主循环 ---------- */
  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    resizeTrailCanvas();
  }
  let frames = 0, fpsT = performance.now();
  function frame(){
    requestAnimationFrame(frame);
    if (autoSpin) spinTarget += 0.0035;
    spin += (spinTarget - spin) * 0.1;
    roll.rotation.y = spin;

    const rx = orbitMode ? 0 : rollTarget.x;
    const ry = orbitMode ? 0 : rollTarget.y;
    rollGroup.position.x += (rx - rollGroup.position.x) * 0.14;
    rollGroup.position.y += (ry - rollGroup.position.y) * 0.14;

    applyCamera();
    camPos.lerp(camTarget, 0.12);
    camLook.lerp(lookTarget, 0.12);
    camera.position.copy(camPos);
    camera.lookAt(camLook);

    if (dragging && !orbitMode){
      addTrailPoint(rollGroup.position.x, rollGroup.position.y);
    }

    // 变化影子：跟随胶带、随自转/拖拽而变
    shadow.position.set(rollGroup.position.x - 0.55, rollGroup.position.y - 0.78, -0.18);
    shadow.quaternion.copy(camera.quaternion);
    const breathe = 1 + 0.06 * Math.sin(spin * 3.1);
    shadow.scale.set(breathe, breathe, 1);
    shadow.material.opacity = 0.55 + 0.15 * Math.sin(spin * 1.9 + rollGroup.position.x * 0.5);

    frames++;
    const now = performance.now();
    if (now - fpsT >= 500){
      if (hudFps) hudFps.textContent = Math.round(frames * 1000 / (now - fpsT));
      frames = 0; fpsT = now;
    }
    renderer.render(scene, camera);
  }

  stage.classList.add('is-3d');
  resize();
  frame();
  window.addEventListener('resize', resize);

  document.getElementById('worksClose').addEventListener('click', function(){ rewind(); setOrbit(false); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ rewind(); setOrbit(false); } });
}

/* ---------- 启动 ---------- */
function boot(){
  preloadAll(function(){ initWorks3D(); });
}
if (typeof THREE !== 'undefined') boot();
else window.__threeReady = boot;
</script>

<script>
/* ============================================================
   p5.js 飘落背景 —— 加载 p5.min.js（本地优先，CDN 兜底）
   ============================================================ */
(function(){
  var urls = [
    'p5.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js',
    'https://unpkg.com/p5@1.9.4/lib/p5.min.js',
    'https://cdn.bootcdn.net/ajax/libs/p5.js/1.9.4/p5.min.js'
  ];
  function boot(){
    if (typeof window.__monetCardBoot === 'function') window.__monetCardBoot();
    if (typeof window.__photoWallBoot === 'function') window.__photoWallBoot();
  }
  function load(i){
    if (window.p5){ boot(); return; }
    if (i >= urls.length) return;
    var done = false, s = document.createElement('script');
    s.src = urls[i];
    function next(){ if (done) return; done = true; s.onload = s.onerror = null; load(i+1); }
    s.onload = function(){ if (window.p5){ done = true; boot(); } else next(); };
    s.onerror = next;
    setTimeout(next, 8000);
    document.head.appendChild(s);
  }
  load(0);
})();
</script>

<script>
/* ============================================================
   飘落粒子：把作业素材文件夹里的照片做成缓缓下落的背景
   ============================================================ */
window.__fallBgBoot = function(){
  if (window.__fallBgOn) return; window.__fallBgOn = true;
  if (typeof p5 === 'undefined') return;
  var IMG_DIR = '作业素材/';
  var IMGS = [
    '12f6de95993b201be67c7d5267645f42.jpg',
    '3e0555ad74af257cc2fdb44bc26ba4a2.jpg',
    '4270ac80a4bbe920eff80efcbe7d1edc.jpg',
    '5e1338cb48c7a7a75e04f9943fbd9220.jpg',
    '6fa9a6ad8446f1d4856543adf430ee73.jpg',
    'bcb96275b4f71aa0f25127bfd0559a24.jpg',
    'd31aa0ed5bb7239c9398c0404c2a69bd.jpg'
  ];
  var loaded = [];
  IMGS.forEach(function(f){
    var im = new Image();
    im.onload = function(){ loaded.push(im); };
    im.src = IMG_DIR + f;
  });
  new p5(function(p){
    var parts = [], N = 14;
    p.setup = function(){
      var c = p.createCanvas(p.windowWidth, p.windowHeight);
      var host = document.getElementById('fallbg');
      if (host) c.parent(host);
      p.pixelDensity(1);
      N = Math.max(6, Math.min(18, Math.floor(p.windowWidth / 90)));
      window.__fallBgState = { imgs: loaded.length, N: N, w: p.width, h: p.height };
    };
    function make(spread){
      var im = loaded.length ? loaded[Math.floor(p.random(loaded.length))] : null;
      var w = p.random(120, 240) * Math.min(1, p.width / 900);
      var h = im ? w * (im.height / im.width) : w * 0.7;
      return {
        im: im,
        x: p.random(-60, p.width + 60),
        y: spread ? p.random(-h * 1.2, p.height) : -h * 1.2,
        w: w, h: h,
        vy: p.random(0.3, 0.9),
        vx: p.random(-0.12, 0.12),
        amp: p.random(14, 46),
        freq: p.random(0.002, 0.006),
        ph: p.random(p.TWO_PI),
        rot: p.random(-0.35, 0.35),
        rv: p.random(-0.004, 0.004),
        a: p.random(65, 115)
      };
    }
    p.draw = function(){
      p.clear();
      if (parts.length === 0){
        if (!loaded.length) return;
        for (var i = 0; i < N; i++) parts.push(make(true));
        window.__fallBgState.imgs = loaded.length;
      }
      var ctx = p.drawingContext;
      for (var i = 0; i < parts.length; i++){
        var q = parts[i];
        q.ph += q.freq;
        q.y += q.vy;
        q.x += q.vx + Math.sin(q.ph) * 0.3;
        q.rot += q.rv;
        if (q.y - q.h > p.height + 40 || q.x < -q.w - 80 || q.x > p.width + q.w + 80){
          parts[i] = make(false);
          continue;
        }
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.rotate(q.rot);
        ctx.globalAlpha = q.a / 255;
        ctx.drawImage(q.im, -q.w / 2, -q.h / 2, q.w, q.h);
        ctx.globalAlpha = 0.32;                    /* 压一层墨绿，融入复古核配色 */
        ctx.fillStyle = '#1e241d';
        ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
        ctx.restore();
      }
    };
    p.windowResized = function(){
      p.resizeCanvas(p.windowWidth, p.windowHeight);
    };
  });
};
</script>

<script>
/* ============================================================
   复古核 · 相片墙 —— 宽屏两侧挂绳相片
   把「作业素材」里的照片做成做旧相片，像洗好的照片挂在页面两侧
   ============================================================ */
window.__photoWallBoot = function(){
  if (window.__photoWallOn) return; window.__photoWallOn = true;
  if (typeof p5 === 'undefined') return;

  var IMG_DIR = '作业素材/';
  var IMGS = [
    '12f6de95993b201be67c7d5267645f42.jpg',
    '3e0555ad74af257cc2fdb44bc26ba4a2.jpg',
    '4270ac80a4bbe920eff80efcbe7d1edc.jpg',
    '5e1338cb48c7a7a75e04f9943fbd9220.jpg',
    '6fa9a6ad8446f1d4856543adf430ee73.jpg',
    'bcb96275b4f71aa0f25127bfd0559a24.jpg',
    'd31aa0ed5bb7239c9398c0404c2a69bd.jpg'
  ];
  var loaded = [];
  IMGS.forEach(function(f){
    var im = new Image();
    im.onload = function(){ loaded.push(im); };
    im.src = IMG_DIR + f;
  });

  new p5(function(p){
    var MAXW = 1180;       // 与 main 的 max-width 一致
    var MIN_GUTTER = 100;  // 每侧留白不够就不画（窄屏保持整洁）
    var slots = [];

    p.setup = function(){
      var c = p.createCanvas(p.windowWidth, p.windowHeight);
      var host = document.getElementById('photowall');
      if (host) c.parent(host);
      p.pixelDensity(1);
      build();
      window.__photoWallState = { imgs: loaded.length, slots: slots.length, w: p.width };
    };

    function build(){
      slots = [];
      var gutter = (p.width - MAXW) / 2;
      if (gutter < MIN_GUTTER) return;
      // 洗牌式取图，让 7 张照片尽量都露脸
      var order = [0, 3, 5, 1, 6, 2, 4];
      var n = p.constrain(Math.floor(p.height / 330), 4, 7);
      for (var i = 0; i < n; i++){
        var side = (i % 2 === 0) ? -1 : 1;
        var lx = p.width / 2 + side * (MAXW / 2 + gutter / 2);
        var cy = p.height * (0.13 + 0.74 * (n === 1 ? 0.5 : i / (n - 1)));
        slots.push({
          side: side,
          lx: lx,
          cy: cy,
          w: p.constrain(gutter * 0.55, 96, 170),
          imIdx: order[i % order.length],
          tilt: p.random(-0.08, 0.08),
          freq: p.random(0.5, 0.9),
          ph: p.random(p.TWO_PI),
          tapeTilt: p.random(-0.22, 0.22)
        });
      }
    }

    p.draw = function(){
      p.clear();
      if (window.__photoWallState) window.__photoWallState.imgs = loaded.length;
      if (!loaded.length) return;
      var gutter = (p.width - MAXW) / 2;
      if (gutter < MIN_GUTTER || slots.length === 0) return;

      var t = p.millis() * 0.001;
      var ctx = p.drawingContext;

      // —— 两侧做旧挂绳 ——
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(201,185,138,0.30)';
      for (var s = -1; s <= 1; s += 2){
        var lx = p.width / 2 + s * (MAXW / 2 + gutter / 2);
        ctx.beginPath();
        for (var y = 0; y <= p.height; y += 6){
          var wx = lx + Math.sin(y * 0.012 + t * 0.5) * 1.6;
          if (y === 0) ctx.moveTo(wx, y); else ctx.lineTo(wx, y);
        }
        ctx.stroke();
      }

      // —— 相片：像钟摆一样轻轻晃动 ——
      for (var i = 0; i < slots.length; i++){
        var q = slots[i];
        var im = loaded[q.imIdx % loaded.length];
        if (!im) continue;
        var swing = Math.sin(t * q.freq + q.ph) * 0.05 + q.tilt * 0.4;
        var w = q.w;
        var h = w * (im.height / im.width);
        var pad = 9, bw = w + pad * 2, bh = h + pad * 2;

        ctx.save();
        ctx.translate(q.lx, q.cy);
        ctx.rotate(swing);

        // 阴影
        ctx.shadowColor = 'rgba(0,0,0,0.42)';
        ctx.shadowBlur = 14; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 6;
        // 相纸边框（做旧米白）
        ctx.fillStyle = '#e9e3d2';
        ctx.fillRect(-bw / 2, 0, bw, bh);
        ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        // 照片
        ctx.globalAlpha = 0.95;
        ctx.drawImage(im, -w / 2, pad, w, h);
        // 复古绿叠色，融入莫兰迪绿配色
        ctx.globalAlpha = 0.20;
        ctx.fillStyle = '#1e241d';
        ctx.fillRect(-w / 2, pad, w, h);
        ctx.globalAlpha = 1;

        // 顶部胶带（钉在挂绳上）
        ctx.save();
        ctx.rotate(q.tapeTilt);
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#c9b98a';
        ctx.fillRect(-27, -6, 54, 13);
        ctx.globalAlpha = 1;
        ctx.restore();

        ctx.restore();
      }
    };

    p.windowResized = function(){
      p.resizeCanvas(p.windowWidth, p.windowHeight);
      build();
    };
  });
};
</script>

/* —— 莫奈花园卡片（p5.js 生成，补上缺照片的板块） —— */
window.__monetCardBoot = function(){
  if (window.__monetCardOn) return; window.__monetCardOn = true;
  if (typeof p5 === 'undefined') return;
  var host = document.querySelector('.module-visual[data-monet="1"]');
  if (!host) return;

  new p5(function(p){
    var GREENS = [[138,154,118],[111,125,95],[168,181,145],[95,122,114]];
    var GOLDS  = [[201,185,138],[216,201,154]];
    var FLOWER = [[201,165,160],[212,179,173],[184,165,201],[165,176,196]];
    var blobs = [], pads = [], motes = [];

    p.setup = function(){
      var w = host.clientWidth || 320, h = host.clientHeight || 150;
      var c = p.createCanvas(w, h);
      c.parent(host);
      p.pixelDensity(1);
      build();
      window.__monetCardState = { w: w, h: h, blobs: blobs.length, pads: pads.length };
    };

    function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

    function build(){
      blobs = []; pads = []; motes = [];
      var i;
      for (i = 0; i < 16; i++){
        blobs.push({ x:p.random(p.width), y:p.random(p.height), r:p.random(40,110),
          c:p.random(GREENS.concat(GOLDS)), a:p.random(0.10,0.24),
          vx:p.random(-0.2,0.2), vy:p.random(-0.12,0.12) });
      }
      for (i = 0; i < 4; i++){
        pads.push({ x:p.random(p.width), y:p.random(p.height), rx:p.random(18,36), ry:p.random(7,14),
          c:p.random(GREENS), bloom:p.random() < 0.7 ? p.random(FLOWER) : null, ph:p.random(p.TWO_PI) });
      }
      for (i = 0; i < 12; i++){
        motes.push({ x:p.random(p.width), y:p.random(p.height), r:p.random(1.5,3.5),
          c:p.random(GOLDS.concat(FLOWER)), a:p.random(0.30,0.55),
          vy:p.random(0.2,0.5), vx:p.random(-0.1,0.1), ph:p.random(p.TWO_PI) });
      }
    }

    function softDot(x, y, r, c, a){
      var ctx = p.drawingContext, g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    p.draw = function(){
      var ctx = p.drawingContext, t = p.millis() * 0.001, i, q;
      var base = ctx.createLinearGradient(0, 0, 0, p.height);
      base.addColorStop(0, '#2a3327'); base.addColorStop(1, '#1c221b');
      ctx.fillStyle = base; ctx.fillRect(0, 0, p.width, p.height);

      for (i = 0; i < blobs.length; i++){
        q = blobs[i]; q.x += q.vx; q.y += q.vy;
        if (q.x < -q.r) q.x = p.width + q.r; else if (q.x > p.width + q.r) q.x = -q.r;
        if (q.y < -q.r) q.y = p.height + q.r; else if (q.y > p.height + q.r) q.y = -q.r;
        softDot(q.x, q.y, q.r, q.c, q.a);
      }

      for (i = 0; i < pads.length; i++){
        q = pads[i]; var bob = Math.sin(t * 0.5 + q.ph) * 1.5;
        ctx.save(); ctx.translate(q.x, q.y + bob); ctx.scale(1, q.ry / q.rx);
        var g = ctx.createRadialGradient(0, 0, 0, 0, 0, q.rx);
        g.addColorStop(0, rgba(q.c, 0.5)); g.addColorStop(1, rgba(q.c, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, q.rx, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (q.bloom){
          var k;
          for (k = 0; k < 6; k++){
            var ang = k / 6 * Math.PI * 2;
            ctx.fillStyle = rgba(q.bloom, 0.7);
            ctx.beginPath();
            ctx.arc(q.x + Math.cos(ang) * 6, q.y + bob + Math.sin(ang) * 3.5, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = 'rgba(201,185,138,0.85)';
          ctx.beginPath(); ctx.arc(q.x, q.y + bob, 2.6, 0, Math.PI * 2); ctx.fill();
        }
      }

      for (i = 0; i < motes.length; i++){
        q = motes[i]; q.y += q.vy; q.x += q.vx + Math.sin(t * 0.7 + q.ph) * 0.3;
        if (q.y > p.height + 5){ q.y = -5; q.x = p.random(p.width); }
        if (q.x < -5) q.x = p.width + 5; else if (q.x > p.width + 5) q.x = -5;
        ctx.globalAlpha = q.a; ctx.fillStyle = rgba(q.c, 1);
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(30,36,29,0.22)'; ctx.fillRect(0, 0, p.width, p.height);
    };

    p.windowResized = function(){
      p.resizeCanvas(host.clientWidth || p.width, host.clientHeight || p.height);
    };
  });
};
</script>
