<title>个人数字名片 · Digital Card</title>
<style>
  /* ============================================================
     莫兰迪绿 · 复古核 —— 个人数字名片（移动端优先）
     ============================================================ */
  :root{
    --bg:           #1e241d;
    --bg-soft:      #262c24;
    --surface:      #2c332a;
    --surface-2:    #363d33;
    --border:       #465042;
    --border-soft:  #38402f;

    --text:         #e6e3d4;
    --text-muted:   #99a08c;

    --accent:       #b8c4a3;
    --accent-deep:  #8a9a76;
    --accent-soft:  rgba(184,196,163,.14);

    --vintage:      #c9b98a;
    --stamp:        #9a8556;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    font-family:"Courier New","Songti SC","STSong","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    letter-spacing:.4px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* 复古核 1：全局胶片颗粒 */
  body::before{
    content:""; position:fixed; inset:0;
    pointer-events:none; z-index:9998; opacity:.07; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* 复古核 2：纸张暗角 */
  body::after{
    content:""; position:fixed; inset:0;
    pointer-events:none; z-index:9997;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.42) 100%);
  }

  /* 慢呼吸的光晕背景 */
  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(184,196,163,.10), transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 82%, rgba(201,185,138,.07), transparent 70%);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.7;transform:scale(1);}
    50%{opacity:1;transform:scale(1.05);}
  }

  /* ========== 名片容器 ========== */
  .card-wrap{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
    gap:28px;
  }

  /* ---------- 顶部标签 ---------- */
  .eyebrow{
    display:inline-block; font-size:10.5px; letter-spacing:5px;
    color:var(--vintage); font-weight:600;
    text-transform:uppercase;
    padding:5px 16px; border:1px solid var(--border-soft);
    background:rgba(201,185,138,.05);
    animation:rise 1s ease both;
  }
  .eyebrow::before{content:"✦  "; color:var(--vintage);}
  .eyebrow::after{content:"  ✦"; color:var(--vintage);}

  /* ---------- 头像区域（复古相框） ---------- */
  .avatar-frame{
    position:relative;
    width:140px; height:140px;
    animation:rise 1s .12s ease both;
  }
  .avatar-frame::before{ /* 外框 */
    content:""; position:absolute; inset:-3px;
    border:1px solid var(--border);
    pointer-events:none;
  }
  .avatar-frame::after{ /* 内双线框 */
    content:""; position:absolute; inset:6px;
    border:1px solid var(--border-soft);
    pointer-events:none; z-index:2;
  }
  .avatar-frame img{
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter:sepia(.12) saturate(.88) contrast(.98);
    border-radius:2px;
  }
  /* 四角装饰 */
  .avatar-corners{position:absolute; inset:-8px; pointer-events:none; z-index:3;}
  .avatar-corners i{position:absolute; width:14px; height:14px; border:1px solid var(--vintage); opacity:.65;}
  .avatar-corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;}
  .avatar-corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;}
  .avatar-corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;}
  .avatar-corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;}

  /* ---------- 姓名与职位 ---------- */
  .name-block{
    text-align:center;
    animation:rise 1s .22s ease both;
  }
  .name{
    font-family:"Courier New",monospace;
    font-size:clamp(32px, 8vw, 48px);
    font-weight:800; letter-spacing:3px; line-height:1.1;
    color:var(--text);
  }
  .name em{
    display:block; font-style:normal; font-size:.5em;
    color:var(--vintage);
    letter-spacing:6px; margin-top:6px;
    font-weight:400;
    text-shadow:0 0 20px rgba(201,185,138,.25);
  }
  .position{
    margin-top:10px;
    font-size:13px; letter-spacing:3px;
    color:var(--text-muted);
  }

  /* ---------- 分隔线 ---------- */
  .divider{
    width:60%; height:1px;
    background:linear-gradient(90deg, transparent, var(--border) 30%, var(--border) 70%, transparent);
    animation:rise 1s .3s ease both;
  }

  /* ---------- 简介 ---------- */
  .bio{
    max-width:420px;
    text-align:center;
    font-size:13.5px;
    color:var(--text-muted);
    line-height:1.9;
    animation:rise 1s .36s ease both;
  }
  .bio b{color:var(--accent); font-weight:600;}

  /* ---------- 联系按钮组 ---------- */
  .actions{
    display:flex; flex-direction:column; gap:12px;
    width:100%; max-width:320px;
    animation:rise 1s .44s ease both;
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 20px;
    font-size:13.5px; font-weight:600; letter-spacing:2px;
    text-decoration:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:all .3s ease;
    position:relative;
    font-family:inherit;
  }
  .btn::before{
    content:""; position:absolute; inset:4px;
    border:1px solid var(--border-soft);
    pointer-events:none;
    transition:border-color .3s ease;
  }
  .btn .icon{
    font-size:16px;
    width:20px; text-align:center;
  }
  .btn:hover, .btn:active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .btn:hover::before, .btn:active::before{
    border-color:var(--accent-deep);
  }

  .btn.primary{
    background:var(--vintage);
    border-color:var(--vintage);
    color:var(--bg);
    font-weight:700;
  }
  .btn.primary::before{
    border-color:rgba(30,36,29,.25);
  }
  .btn.primary:hover, .btn.primary:active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--bg);
  }
  .btn.primary:hover::before, .btn.primary:active::before{
    border-color:rgba(30,36,29,.2);
  }

  /* ---------- 底部标签 ---------- */
  .footer-note{
    font-size:10px; letter-spacing:4px;
    color:var(--text-muted);
    animation:rise 1s .56s ease both;
  }
  .footer-note::before{content:"— "; color:var(--border);}
  .footer-note::after{content:" —"; color:var(--border);}

  /* ---------- vCard 生成提示 toast ---------- */
  .toast{
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(.9);
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:16px 28px;
    font-size:13px; letter-spacing:2px;
    z-index:10000;
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
  }
  .toast::before{
    content:""; position:absolute; inset:4px;
    border:1px solid var(--border-soft);
    pointer-events:none;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ========== 移动端优化 ========== */
  @media (max-width:480px){
    .card-wrap{padding:32px 16px; gap:22px;}
    .avatar-frame{width:120px; height:120px;}
    .name{letter-spacing:2px;}
    .position{font-size:12px; letter-spacing:2px;}
    .bio{font-size:12.5px;}
    .btn{padding:13px 18px; font-size:13px;}
  }

  /* 横屏适配 */
  @media (max-height:500px) and (orientation:landscape){
    .card-wrap{padding:20px; gap:14px; flex-direction:row; flex-wrap:wrap; justify-content:center;}
    .avatar-frame{width:100px; height:100px;}
    .name-block{flex-basis:100%;}
    .bio{flex-basis:100%;}
    .actions{flex-direction:row; flex-wrap:wrap; max-width:500px; justify-content:center;}
    .btn{flex:1; min-width:140px;}
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<main class="card-wrap">

  <span class="eyebrow">Digital Card</span>

  <!-- 头像 -->
  <div class="avatar-frame">
    <img id="avatarImg" src="" alt="头像">
    <span class="avatar-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </div>

  <!-- 姓名职位 -->
  <div class="name-block">
    <h1 class="name">
      <span id="userName">张皓然</span>
      <em id="nameEn">ZHANG HAORAN</em>
    </h1>
    <p class="position" id="userPosition">产品经理 · 全栈开发者</p>
  </div>

  <!-- 分隔线 -->
  <div class="divider"></div>

  <!-- 简介 -->
  <p class="bio" id="userBio">
    专注于<b>产品设计</b>与<b>前端开发</b>，热爱用技术创造有温度的数字体验。
    欢迎交流合作，一起探索更多可能性。
  </p>

  <!-- 联系按钮 -->
  <div class="actions">
    <a class="btn primary" href="tel:" id="btnCall">
      <span class="icon">☎</span>
      <span>一键拨号</span>
    </a>
    <a class="btn" href="mailto:" id="btnEmail">
      <span class="icon">✉</span>
      <span>发送邮件</span>
    </a>
    <a class="btn" href="#" id="btnWebsite" target="_blank" rel="noopener">
      <span class="icon">↗</span>
      <span>访问个人网站</span>
    </a>
    <a class="btn" href="#" id="btnHabit" target="_blank" rel="noopener">
      <span class="icon">☑</span>
      <span>我的书斋 · 习惯打卡</span>
    </a>
    <button class="btn" id="btnVcard" type="button">
      <span class="icon">❖</span>
      <span>保存至通讯录</span>
    </button>
  </div>

  <!-- 底部 -->
  <p class="footer-note">MOBILE FIRST · 名片分享</p>

</main>

<!-- Toast 提示 -->
<div class="toast" id="toast" role="status" aria-live="polite">vCard 已生成，正在下载…</div>

<script>
/* ============================================================
   个人数字名片 · 可配置信息
   ============================================================ */
(function(){
  // ===== 可配置信息（修改这里即可更换名片内容） =====
  var CARD = {
    name:      '张皓然',
    nameEn:    'ZHANG HAORAN',
    position:  '产品经理 · 全栈开发者',
    // 头像：可替换为本地图片路径或在线图片URL
    avatar:    'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
      '<rect width="200" height="200" fill="#2c332a"/>' +
      '<circle cx="100" cy="80" r="36" fill="#8a9a76"/>' +
      '<ellipse cx="100" cy="170" rx="56" ry="44" fill="#8a9a76"/>' +
      '</svg>'
    ),
    phone:     '13037110609',
    email:     '1140127933@qq.com',
    company:   '幻境工作室',
    title:     '产品经理',
    address:   '',
    website:   'https://12ti278.github.io/personal-website/',
    habit:     'https://12ti278.github.io/habit-tracker/',
    note:      '专注于产品设计与前端开发',
    bio:       '专注于<b>产品设计</b>与<b>前端开发</b>，热爱用技术创造有温度的数字体验。<br>欢迎交流合作，一起探索更多可能性。'
  };

  // ===== 填充内容 =====
  document.getElementById('userName').textContent = CARD.name;
  document.getElementById('nameEn').textContent = CARD.nameEn;
  document.getElementById('userPosition').textContent = CARD.position;
  document.getElementById('userBio').innerHTML = CARD.bio;
  document.getElementById('avatarImg').src = CARD.avatar;
  document.getElementById('avatarImg').alt = CARD.name + '的头像';

  document.getElementById('btnCall').href = 'tel:' + CARD.phone;
  document.getElementById('btnEmail').href = 'mailto:' + CARD.email;
  document.getElementById('btnWebsite').href = CARD.website;
  document.getElementById('btnHabit').href = CARD.habit;

  // ===== vCard 生成与下载 =====
  function generateVCard(){
    var vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + CARD.name + ';;;',
      'FN:' + CARD.name,
      'ORG:' + CARD.company,
      'TITLE:' + CARD.title,
      'TEL;TYPE=CELL,VOICE:' + CARD.phone,
      'EMAIL;TYPE=INTERNET:' + CARD.email
    ];
    if (CARD.website) vcf.push('URL:' + CARD.website);
    if (CARD.address) vcf.push('ADR;TYPE=WORK:;;' + CARD.address + ';;;;');
    if (CARD.note)    vcf.push('NOTE:' + CARD.note);
    vcf.push('END:VCARD');
    return vcf.join('\r\n');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  document.getElementById('btnVcard').addEventListener('click', function(){
    var vcf = generateVCard();
    var blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CARD.name + '.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
    showToast('vCard 已生成，正在下载…');
  });

  // ===== 标题 =====
  document.title = CARD.name + ' · 数字名片';

})();
</script>

</body>
