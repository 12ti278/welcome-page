<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光商社 · 阶段作业 —— Course Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF5E6;
    --cream-deep: #F5E6C8;
    --cream-light: #FEF9EF;
    --brown: #3D2914;
    --brown-light: #5C3D1E;
    --brown-muted: #7A5C3E;
    --gold: #B8860B;
    --gold-light: #DAA520;
    --gold-dark: #8B6914;
    --sepia: #8B7355;
    --border: #D4C4A8;
    --shadow: rgba(61, 41, 20, 0.12);
    --shadow-strong: rgba(61, 41, 20, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Lora', Georgia, serif;
    background-color: var(--cream);
    color: var(--brown);
    line-height: 1.75;
    font-size: 16px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(218, 165, 32, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(139, 105, 20, 0.05) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    background-attachment: fixed;
  }

  /* ---------- Navigation ---------- */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(253, 245, 230, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0;
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
  }

  .nav-logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--brown);
    letter-spacing: 0.08em;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-logo .ornament {
    color: var(--gold);
    font-size: 14px;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'Lora', Georgia, serif;
    font-size: 14px;
    color: var(--brown-muted);
    text-decoration: none;
    letter-spacing: 0.06em;
    transition: color 0.3s ease;
    position: relative;
    font-style: italic;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.3s ease;
  }

  .nav-links a:hover { color: var(--gold-dark); }
  .nav-links a:hover::after { width: 100%; }
  .nav-links a.active { color: var(--gold-dark); }
  .nav-links a.active::after { width: 100%; }

  /* ---------- Hero / Title Section ---------- */
  .hero {
    text-align: center;
    padding: 90px 24px 70px;
    position: relative;
  }

  .hero-eyebrow {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: var(--gold-dark);
    letter-spacing: 0.2em;
    margin-bottom: 18px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(48px, 8vw, 80px);
    font-weight: 700;
    color: var(--brown);
    letter-spacing: 0.08em;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .hero-title .cn {
    display: block;
    font-weight: 700;
  }

  .hero-title .en {
    display: block;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 0.38em;
    color: var(--sepia);
    letter-spacing: 0.25em;
    margin-top: 10px;
    text-transform: none;
  }

  .hero-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 36px 0 28px;
  }

  .hero-divider .line {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .hero-divider .diamond {
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .hero-divider .ornament-star {
    color: var(--gold);
    font-size: 13px;
  }

  .hero-subtitle {
    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    color: var(--brown-muted);
    font-style: italic;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.8;
    letter-spacing: 0.03em;
  }

  /* ---------- Gallery Section ---------- */
  .gallery-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 48px;
  }

  /* ---------- Vintage Frame Card ---------- */
  .homework-card {
    background: var(--cream-light);
    border-radius: 3px;
    overflow: visible;
    position: relative;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
  }

  .homework-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 48px var(--shadow-strong);
  }

  /* Outer frame - double border vintage look */
  .homework-card::before {
    content: '';
    position: absolute;
    top: -12px;
    left: -12px;
    right: -12px;
    bottom: -12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    pointer-events: none;
    z-index: -1;
  }

  .homework-card::after {
    content: '';
    position: absolute;
    top: -8px;
    left: -8px;
    right: -8px;
    bottom: -8px;
    border: 1px solid var(--gold);
    border-radius: 3px;
    pointer-events: none;
    z-index: -1;
    opacity: 0.4;
  }

  /* Corner decorations */
  .frame-corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: var(--gold);
    border-style: solid;
    z-index: 2;
    pointer-events: none;
  }

  .frame-corner.tl { top: -6px; left: -6px; border-width: 2px 0 0 2px; }
  .frame-corner.tr { top: -6px; right: -6px; border-width: 2px 2px 0 0; }
  .frame-corner.bl { bottom: -6px; left: -6px; border-width: 0 0 2px 2px; }
  .frame-corner.br { bottom: -6px; right: -6px; border-width: 0 2px 2px 0; }

  .card-image-wrapper {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    margin: 16px 16px 0;
    border-radius: 2px;
    background: var(--cream-deep);
  }

  .card-image-wrapper::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    bottom: 6px;
    border: 1px solid rgba(212, 196, 168, 0.5);
    border-radius: 1px;
    pointer-events: none;
    z-index: 2;
  }

  .card-image-wrapper a {
    display: block;
  }

  .card-image-wrapper img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.6s ease, filter 0.4s ease;
    filter: sepia(0.05) saturate(0.95);
  }

  .homework-card:hover .card-image-wrapper img {
    transform: scale(1.04);
    filter: sepia(0) saturate(1);
  }

  .card-image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(61, 41, 20, 0.3) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 24px;
  }

  .homework-card:hover .card-image-overlay {
    opacity: 1;
  }

  .overlay-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: var(--cream);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid rgba(253, 245, 230, 0.6);
    padding: 8px 24px;
    border-radius: 2px;
    backdrop-filter: blur(4px);
  }

  .card-content {
    padding: 28px 28px 32px;
    position: relative;
  }

  .card-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--gold-dark);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-label::before {
    content: '';
    width: 20px;
    height: 1px;
    background: var(--gold);
  }

  .card-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--brown);
    letter-spacing: 0.04em;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .card-subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 17px;
    color: var(--sepia);
    font-weight: 400;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }

  .card-divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 20px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .tag {
    font-family: 'Lora', Georgia, serif;
    font-size: 12px;
    font-style: italic;
    color: var(--gold-dark);
    background: rgba(184, 134, 11, 0.08);
    border: 1px solid rgba(184, 134, 11, 0.25);
    padding: 4px 12px;
    border-radius: 2px;
    letter-spacing: 0.04em;
    transition: all 0.3s ease;
  }

  .card-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Lora', Georgia, serif;
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 2px;
    transition: all 0.3s ease;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: var(--brown);
    color: var(--cream);
    border-color: var(--brown);
  }

  .btn-primary:hover {
    background: var(--brown-light);
    border-color: var(--brown-light);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--brown);
    border-color: var(--gold);
    position: relative;
  }

  .btn-secondary::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 2px;
    border: 1px solid rgba(184, 134, 11, 0.3);
    border-radius: 1px;
    pointer-events: none;
  }

  .btn-secondary:hover {
    background: rgba(184, 134, 11, 0.08);
    transform: translateY(-1px);
  }

  /* ---------- Footer ---------- */
  .footer {
    border-top: 1px solid var(--border);
    padding: 40px 32px;
    text-align: center;
    position: relative;
    background: rgba(245, 230, 200, 0.3);
    margin-top: 40px;
  }

  .footer-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .footer-ornament .line {
    width: 60px;
    height: 1px;
    background: var(--border);
  }

  .footer-ornament .star {
    color: var(--gold);
    font-size: 12px;
  }

  .footer-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: var(--sepia);
    letter-spacing: 0.08em;
    line-height: 1.8;
  }

  .footer-text .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: normal;
    color: var(--brown);
    font-weight: 600;
    letter-spacing: 0.1em;
  }

  /* ---------- Scroll Animation ---------- */
  .fade-in {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 768px) {
    .nav-inner {
      padding: 14px 20px;
      flex-direction: column;
      gap: 12px;
    }

    .nav-links {
      gap: 24px;
    }

    .hero {
      padding: 60px 20px 50px;
    }

    .gallery-section {
      padding: 30px 20px 60px;
    }

    .gallery-grid {
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .card-buttons {
      flex-direction: column;
    }

    .btn {
      justify-content: center;
    }
  }
</style>
</head>
<body>

<nav class="navbar">

<!-- Footer -->

<script>
  // Scroll fade-in animation
  const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, observerOptions);

  document.querySelectorAll('.fade-in').forEach(el => {
    observer.observe(el);
  });
</script>
